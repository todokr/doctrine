# doctrine の既定ワークフロー（dctl project-add が雛形として作成）
#
# テストや lint などの command ステップは、プロジェクトに合わせて自分で足す。
# command ステップはクラッシュ復帰時に頭から再実行されるので、
# 再実行しても安全なコマンドにすること（pnpm test は安全、gh pr create は危険）。
name: default
steps:
  - id: implement
    type: agent
    prompt: "{{ task.prompt }}"
    permissionMode: acceptEdits
    # acceptEdits では Bash がすべて拒否されるので、このリポジトリで要るものだけ許可する。
    allowedTools:
      - "Bash(mise run core:test:*)"
      - "Bash(mise run core:check:*)"
      - "Bash(mise run app:test:*)"
      - "Bash(deno fmt:*)"
      - "Bash(deno eval:*)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git add:*)"
      - "Bash(git commit:*)"
      - "Bash(grep:*)"
      - "Bash(awk:*)"
      - "Bash(sed -n:*)"
      - "Bash(ls:*)"
      - "Bash(cat:*)"

  - id: review
    type: approval
    title: "変更を確認してください"

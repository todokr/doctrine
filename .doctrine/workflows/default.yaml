# doctrine の既定ワークフロー
# （plan → plan-review → implement → verify → agent-review → guide → review → sync → verify-sync → open-pr → wait-merge）
#
# エージェントを planner / plan-reviewer / implementer / code-reviewer / guide の5つの役割に分け、
# 役割の間は .doctrine-out/ のファイルで成果物を受け渡す。
# 審査役を計画用と実装用で分けているのは、agent-review が計画審査のときの
# 探索履歴を抱えたまま再開されないようにするため。
# guide も同じ理由で独立した役割にしてあり、実装や審査の探索履歴を継がずに
# 差分だけを読んでガイドを書く。
#
# verify は型検査とテストを回すだけの command ステップ。通ったかどうかを
# エージェントに確かめさせず、ここで機械的に落とす。core / app / pfd の3つとも流す。
# app は依存の取得（pnpm install --frozen-lockfile）から始めるので、
# pnpm-lock.yaml が package.json と食い違っていればここで落ちる。
#
# 2つのゲート（plan-gate / review-gate）は、審査役が書いた成果物ファイルの
# 1行目の verdict を grep で見るだけの command ステップ。
# reject なら成果物ファイルを stdout に出して落ち、onFailure で前の工程へ戻る。
# feed はゲート自身の last_stdout（＝審査結果のファイルの中身）を渡す。
#   plan-gate   が落ちたら plan へ（最大3回）
#   verify      が落ちたら implement へ（最大3回）
#   review-gate が落ちたら implement へ（最大3回）
#   guide       の検証が落ちたら guide 自身へ（最大3回。onFailure を書かない既定の分岐）
#   review（人の承認）で却下されたら implement へ（最大5回）
#   verify-sync が落ちたら sync へ（最大3回。使い切ったら人の判断を待つ）
#   wait-merge  が conflict を見たら sync へ（最大10回。使い切ったら人の判断を待つ）
#
# review の後で develop を取り込み（sync）、テストを通してから PR を開き、マージされるまで待つ。
# マージを待っている間に develop と conflict したら、sync に戻って直し、open-pr で push し直す。
# 初回の sync は conflict が無ければ git merge だけで終わり、PR を develop に追従した状態で開く。
# 自動で解決した conflict は人に見直させず、sync が書いた記録を open-pr が PR にコメントする。
# PR がマージされずに閉じられたら、タスクは canceled で終わる。
#
# maxAttempts を使い切ってもゲートが通らない場合、タスクは failed になる。
# guide が3回とも検証に落ちたときも同じで、人の review に届かないまま failed になる。
# そのとき worktree は削除されずに残るので、中を見て手で直すか、タスクを作り直す。
#
# review-gate は `verdict: escalate` も通す。implement が自分では直せない指摘
# （許可されていないコマンドが要る、など）を implement へ戻しても同じ reject を
# 繰り返して maxAttempts を使い切るだけなので、人の review へ進めて判断を仰ぐ。
# implement は毎回 .doctrine-out/implement-notes.md にできなかったことを書き、
# agent-review はそれを読んで reject と escalate を分ける。
#
# command ステップはクラッシュ復帰時に頭から再実行されるので、
# 再実行しても安全なコマンドにすること（grep は安全、gh pr create は危険）。
name: default
steps:
  - id: plan
    type: agent
    session: planner
    model: claude-opus-5
    permissionMode: acceptEdits
    allowedTools:
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git show:*)"
      - "Bash(git apply --stat:*)"
      - "Bash(grep:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(wc:*)"
      - "Bash(ls:*)"
      - "Bash(find:*)"
      - "Bash(sed -n:*)"
      - "Bash(mise tasks:*)"
      - "Bash(deno fmt --check:*)"
      - "Bash(gh pr view:*)"
      - "Bash(gh pr list:*)"
      - "Bash(gh pr diff:*)"
      - "Bash(gh issue view:*)"
      - "Bash(gh issue list:*)"
    prompt: |
      次のタスクの実装計画を立ててください。

      ---
      {{ task.prompt }}
      ---

      リポジトリを調べたうえで、計画を {{ worktree.path }}/.doctrine-out/plan.md に書いてください。
      この計画を読む実装者は、あなたの調査結果を知らない別のエージェントです。
      実装者がリポジトリを調べ直さずに着手できるように、調べて分かったことを計画に残します。
      見出しは次の5つにします。

      - 「調べて分かったこと」: 再利用する既存の関数・型・テストヘルパー（パスと名前）、
        周辺コードが従っている書き方、実装者がはまりそうな点。
      - 「変更するファイル」: パスごとに、触る関数名・型名と行番号の範囲。新規ファイルはその旨。
      - 「変更内容」: 作業の順序とコミットの単位。追加・変更するシグネチャと型定義は書きます。
        関数の中身は書かず、何をするかを文章で書きます。
      - 「テスト」: 追加するテストファイルのパス、テストケースの名前、入力と期待値。
      - 「やらないこと」

      実装者が読む必要のないファイルは挙げないでください。
      計画を書くだけで、リポジトリのコードは変更しないでください。

      作業ディレクトリは worktree のルートです。Bash に渡すパスは worktree のルートからの
      相対で書いてください。コマンドは1つずつ実行してください。`&&` や `cd` でつなぐと
      権限で拒否されます。許可は `&&` でつないだ各コマンドに個別に照合されるので、
      `cd core && deno fmt --check` は `cd` の側で落ちます。
      `git` に `-C` を付けないでください。`Bash(git diff:*)` のような許可に前方一致
      しなくなります。`git diff develop...HEAD` のようにそのまま書きます。

      差し戻されて再度呼ばれた場合は、指摘を踏まえて plan.md を全文書き直してください。

  - id: plan-review
    type: agent
    session: plan-reviewer
    model: claude-opus-5
    permissionMode: acceptEdits
    allowedTools:
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git show:*)"
      - "Bash(git apply --stat:*)"
      - "Bash(grep:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(wc:*)"
      - "Bash(ls:*)"
      - "Bash(find:*)"
      - "Bash(sed -n:*)"
      - "Bash(mise tasks:*)"
      - "Bash(deno fmt --check:*)"
      - "Bash(deno lint:*)"
      - "Bash(gh pr view:*)"
      - "Bash(gh pr list:*)"
      - "Bash(gh pr diff:*)"
      - "Bash(gh issue view:*)"
      - "Bash(gh issue list:*)"
    prompt: |
      {{ worktree.path }}/.doctrine-out/plan.md を毎回読み直して審査し、結果を
      {{ worktree.path }}/.doctrine-out/plan-review.md に上書きしてください。

      元のタスクは次のとおりです。

      ---
      {{ task.prompt }}
      ---

      見るのは次の3点です。

      - タスクの要求を満たす計画か。余計なことをしていないか
      - 実装者がリポジトリを調べ直さずに着手できる具体さか（触る関数、シグネチャ、テストケースが書いてあるか）
      - 計画に書かれたパス・関数名・型名が実在するか。grep や sed -n で、挙げられた箇所だけを確かめます

      リポジトリ全体を調べ直す必要はありません。計画が挙げた箇所を確かめれば足ります。

      作業ディレクトリは worktree のルートです。Bash に渡すパスは worktree のルートからの
      相対で書いてください。コマンドは1つずつ実行してください。`&&` や `cd` でつなぐと
      権限で拒否されます。許可は `&&` でつないだ各コマンドに個別に照合されるので、
      `cd core && deno fmt --check` は `cd` の側で落ちます。
      `git` に `-C` を付けないでください。`Bash(git diff:*)` のような許可に前方一致
      しなくなります。`git diff develop...HEAD` のようにそのまま書きます。

      plan-review.md の1行目は必ず `verdict: approve` か `verdict: reject` のどちらかにします。
      2行目以降に指摘を書いてください。修正が必要な具体的な指摘があるときだけ reject にします。

      指摘は plan-review.md から後続のステップへ渡ります。最終応答は verdict の1行だけで構いません。

  - id: plan-gate
    type: command
    run: "grep -q '^verdict: approve' .doctrine-out/plan-review.md || { cat .doctrine-out/plan-review.md || echo 'plan-review.md が書かれていない'; exit 1; }"
    onFailure:
      goto: plan
      maxAttempts: 3
      feed: |
        計画がレビューで却下された:
        {{ steps.plan-gate.last_stdout }}

  - id: implement
    type: agent
    session: implementer
    model: claude-sonnet-5
    permissionMode: acceptEdits
    # acceptEdits では Bash がすべて拒否されるので、このリポジトリで要るものだけ許可する。
    # 許可は `&&` や `cd` でつないだ各コマンドに個別に照合されるため、`cd app && pnpm add`
    # は通らない。app の依存は `pnpm -C app`、deno lint はパスを引数に渡して実行させる。
    allowedTools:
      - "Bash(mise run core:test:*)"
      - "Bash(mise run core:check:*)"
      - "Bash(mise run core:deps:*)"
      - "Bash(mise run app:deps:*)"
      - "Bash(mise run app:test:*)"
      - "Bash(mise run app:build:*)"
      - "Bash(mise run pfd:deps:*)"
      - "Bash(mise run pfd:test:*)"
      - "Bash(mise run pfd:check:*)"
      - "Bash(pnpm -C app:*)"
      - "Bash(deno fmt:*)"
      - "Bash(deno lint:*)"
      - "Bash(deno eval:*)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git show:*)"
      - "Bash(git apply --stat:*)"
      - "Bash(git add:*)"
      - "Bash(git commit:*)"
      - "Bash(grep:*)"
      - "Bash(awk:*)"
      - "Bash(sed -n:*)"
      - "Bash(ls:*)"
      - "Bash(find:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(wc:*)"
      - "Bash(mise tasks:*)"
      - "Bash(gh pr view:*)"
      - "Bash(gh pr list:*)"
      - "Bash(gh pr diff:*)"
      - "Bash(gh issue view:*)"
      - "Bash(gh issue list:*)"
    prompt: |
      {{ worktree.path }}/.doctrine-out/plan.md を読んでから実装してください。

      元のタスクは次のとおりです。

      ---
      {{ task.prompt }}
      ---

      plan.md は、リポジトリを調べたうえで書かれ、審査を通っています。
      plan.md が挙げたファイルと行から着手し、それ以外は必要になるまで読まないでください。
      plan.md が実際のコードと食い違っていたら、コードに合わせて実装し、食い違いを最終応答に書いてください。

      テストを先に書いてから実装します。触ったディレクトリの検証を通してから git commit してください。

      - core/ と shared/: `mise run core:check` と `mise run core:test`
      - app/ と shared/: `mise run app:test` と `mise run app:build`
      - pfd/: `mise run pfd:check` と `mise run pfd:test`

      作業ディレクトリは worktree のルートです。Bash に渡すパスは worktree のルートからの相対で書いてください。
      コマンドは1つずつ実行してください。`&&` や `cd` でつなぐと権限で拒否されます。
      `git` に `-C` を付けないでください。`Bash(git diff:*)` のような許可に前方一致しなくなります。`git diff develop...HEAD` のようにそのまま書きます。
      app の依存を足すときは `pnpm -C app add <パッケージ>` を使い、pnpm-lock.yaml は手で編集しないでください。
      deno lint は `deno lint core/src/...` のようにパスを渡して実行します。

      差し戻されて再度呼ばれた場合は、指摘を直して再度コミットしてください。

      最後に {{ worktree.path }}/.doctrine-out/implement-notes.md を毎回上書きしてください。書くのは次の3点です。

      - 今回やったこと
      - 実行して通した検証コマンド
      - できなかったこと。権限で拒否されたコマンドはコマンド名をそのまま書き、
        人に代わりにやってほしい手順があればそれも書きます。無ければ「なし」と書きます

      必要なコマンドが権限で拒否されたときは、ロックファイルの手編集のような回避策を取らず、
      できる範囲までコミットして、できなかったことを implement-notes.md に書いて終えてください。

  # deno test は失敗の詳細を stdout に、deno check は stderr に出すので両方渡す。
  # app:deps を app:test の前に置くのは、implement が依存を足した直後でも
  # node_modules が pnpm-lock.yaml と揃った状態でテストを流すため。
  - id: verify
    type: command
    run: "mise run core:check && mise run core:test && mise run app:deps && mise run app:test && mise run app:build && mise run pfd:check && mise run pfd:test"
    onFailure:
      goto: implement
      maxAttempts: 3
      feed: |
        型検査かテストが失敗した:
        {{ steps.verify.last_stdout }}
        {{ steps.verify.last_stderr }}

  - id: agent-review
    type: agent
    session: code-reviewer
    model: claude-opus-5
    permissionMode: acceptEdits
    allowedTools:
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git show:*)"
      - "Bash(git apply --stat:*)"
      - "Bash(grep:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(wc:*)"
      - "Bash(ls:*)"
      - "Bash(find:*)"
      - "Bash(sed -n:*)"
      - "Bash(mise tasks:*)"
      - "Bash(deno fmt --check:*)"
      - "Bash(deno lint:*)"
      - "Bash(gh pr view:*)"
      - "Bash(gh pr list:*)"
      - "Bash(gh pr diff:*)"
      - "Bash(gh issue view:*)"
      - "Bash(gh issue list:*)"
    prompt: |
      直前の verify ステップで、core の型検査とテスト、app の依存の取得
      （pnpm install --frozen-lockfile）・テスト・ビルド（tsc と vite build）、
      pfd の型検査とテストが通っています。自分で回す必要はありません。
      deno fmt --check と deno lint、cargo は verify に含まれていません。

      implement が積んだコミットを毎回読み直して審査し、結果を
      {{ worktree.path }}/.doctrine-out/review.md に上書きしてください。

      作業ディレクトリは worktree のルートです。Bash に渡すパスは worktree のルートからの
      相対で書いてください。コマンドは1つずつ実行してください。`&&` や `cd` でつなぐと
      権限で拒否されます。許可は `&&` でつないだ各コマンドに個別に照合されるので、
      `cd core && deno fmt --check` は `cd` の側で落ちます。
      `git` に `-C` を付けないでください。`Bash(git diff:*)` のような許可に前方一致
      しなくなります。`git diff develop...HEAD` のようにそのまま書きます。
      `deno fmt --check --config core/deno.json` のように、ルートからの相対パスで実行します。

      `git diff develop...HEAD` と `git log develop..HEAD` で実装の差分とコミットを読み、
      {{ worktree.path }}/.doctrine-out/plan.md と突き合わせます。
      {{ worktree.path }}/.doctrine-out/implement-notes.md も読みます。実装者が、やったこと・
      通した検証・できなかったことを書いています。見るのは次の3点です。

      - plan.md との乖離
      - テスト不足
      - CLAUDE.md の規約違反

      review.md の1行目は必ず `verdict: approve` / `verdict: reject` / `verdict: escalate` の
      どれかにします。2行目以降に指摘を書いてください。

      - reject: 修正が必要な具体的な指摘があり、実装者が直せるとき。実装者へ差し戻されます
      - escalate: 修正が必要な指摘が残っているが、実装者には直せないとき。人のレビューへ進みます。
        implement-notes.md に権限で拒否されたコマンドが書かれていて指摘の対応にそのコマンドが要る場合や、
        前回と同じ指摘なのに HEAD が動いていない場合がこれに当たります。
        同じ指摘で reject を繰り返さないでください。
        2行目以降の先頭に、人にやってほしい手順をコマンドつきで書きます
      - approve: それ以外

      指摘は review.md から後続のステップへ渡ります。最終応答は verdict の1行だけで構いません。

  - id: review-gate
    type: command
    run: "grep -qE '^verdict: (approve|escalate)' .doctrine-out/review.md || { cat .doctrine-out/review.md || echo 'review.md が書かれていない'; exit 1; }"
    onFailure:
      goto: implement
      maxAttempts: 3
      feed: |
        実装がレビューで却下された:
        {{ steps.review-gate.last_stdout }}

  # プロンプトは doctrine が組み立てるので prompt は書けない（書くとスキーマで落ちる）。
  # onFailure を書いていないのは、guide ステップの既定が「自分へ戻る・3回・
  # {{ steps.guide.last_stderr }} を feed」で、ここに置きたい値と同じため。
  # 組み込みプロンプトが `git diff` を実行するので Bash(git diff:*) は外せない。
  - id: guide
    type: guide
    session: guide
    model: claude-opus-5
    permissionMode: acceptEdits
    allowedTools:
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git show:*)"
      - "Bash(git apply --stat:*)"
      - "Bash(grep:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(wc:*)"
      - "Bash(ls:*)"
      - "Bash(find:*)"
      - "Bash(sed -n:*)"
      - "Bash(mise tasks:*)"
      - "Bash(deno fmt --check:*)"
      - "Bash(deno lint:*)"
      - "Bash(gh pr view:*)"
      - "Bash(gh pr list:*)"
      - "Bash(gh pr diff:*)"
      - "Bash(gh issue view:*)"
      - "Bash(gh issue list:*)"

  - id: review
    type: approval
    title: "変更を確認してください"
    onReject:
      goto: implement
      maxAttempts: 5
      feed: |
        人のレビューで却下された:
        {{ steps.review.last_stdout }}
    review:
      files:
        - .doctrine-out/review.md
        - .doctrine-out/implement-notes.md
        - .doctrine-out/plan.md

  - id: sync
    type: agent
    session: implementer
    model: claude-sonnet-5
    permissionMode: acceptEdits
    allowedTools:
      - "Bash(git fetch:*)"
      - "Bash(git merge:*)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git show:*)"
      - "Bash(git add:*)"
      - "Bash(git commit:*)"
      - "Bash(mise run core:test:*)"
      - "Bash(mise run core:check:*)"
      - "Bash(mise run core:deps:*)"
      - "Bash(mise run app:deps:*)"
      - "Bash(mise run app:test:*)"
      - "Bash(mise run app:build:*)"
      - "Bash(mise run pfd:deps:*)"
      - "Bash(mise run pfd:test:*)"
      - "Bash(mise run pfd:check:*)"
      - "Bash(pnpm -C app:*)"
      - "Bash(grep:*)"
      - "Bash(sed -n:*)"
      - "Bash(cat:*)"
      - "Bash(ls:*)"
    prompt: |
      develop の最新をこのブランチに取り込んでください。

      1. `git fetch origin develop` を実行し、続けて `git merge --no-edit origin/develop` を実行します。
      2. conflict が無ければ、それで終わりです。何も書かずに終えてください。
      3. conflict があれば、両側の意図を保つように解決し、触ったディレクトリの検証を通してから
         `git add` と `git commit --no-edit` でマージコミットを作ってください。rebase はしないでください。
         解決したら {{ worktree.path }}/.doctrine-out/sync-notes.md に次を書きます。
         - conflict したファイル
         - それぞれをどう解決したか（どちらの変更を残したか、両方を合わせたか）

      コマンドは1つずつ実行してください。`&&` や `cd` でつなぐと権限で拒否されます。

  - id: verify-sync
    type: command
    run: "mise run core:check && mise run core:test && mise run app:deps && mise run app:test && mise run app:build && mise run pfd:check && mise run pfd:test"
    onFailure:
      goto: sync
      maxAttempts: 3
      onExhausted: suspend
      feed: |
        develop を取り込んだ後の型検査かテストが失敗した:
        {{ steps.verify-sync.last_stdout }}
        {{ steps.verify-sync.last_stderr }}

  # 人の承認が済んだものだけを PR にする。command ステップはクラッシュ復帰・resume の
  # たびに頭から再実行されるので、既に PR があれば作らない形にしてある。push は同じ
  # コミットを送り直すだけなので、二度実行しても効果が変わらない。
  #
  # gh pr create と git push は NON_IDEMPOTENT に引っかかり、dctl add のたびに警告が出る。
  # 検出は文字列でしか見ないのでガードの有無を区別できない。警告は消さないでおく。
  # 正規表現にガードを理解させると、ガードを外したときに黙って通るようになる。
  #
  # base を直書きしているのは、テンプレート変数に project.yaml の baseBranch が無く、
  # 展開できないため。
  # 本文の implement-notes.md は implement が毎回上書きしていて、中身が
  # 「やったこと・通した検証・できなかったこと」なので PR 本文としてそのまま読める。
  # Intake から投入されたタスクなら、末尾に {{ issue.closes }} の行を足して、
  # PR のマージで sub-issue を閉じる。Intake 由来でないタスクでは空文字なので、
  # 本文は implement-notes.md のまま。
  - id: open-pr
    type: command
    run: "git push -u origin HEAD && { gh pr view --json url --jq .url || { cat .doctrine-out/implement-notes.md; if [ -n '{{ issue.closes }}' ]; then printf '\\n%s\\n' '{{ issue.closes }}'; fi; } | gh pr create --base develop --title \"{{ task.title }}\" --body-file -; } && if [ -f .doctrine-out/sync-notes.md ]; then gh pr comment --body-file .doctrine-out/sync-notes.md && rm .doctrine-out/sync-notes.md; fi"

  # 「まだ」は 75、閉じられたら 2（spec 2026-09-22-merge-wait-design.md 3 章）。
  # push 直後の mergeable は UNKNOWN になるので、まだとして待つ。
  # BEHIND（conflict は無いが遅れている）は追わない。
  # gh pr view の出力を `| { read ... }` に渡すと、パイプ全体の終了コードは右側（read/case）の
  # ものになり、gh 自身が認証切れやネットワーク断で失敗しても "" が read され、どの明示パターンにも
  # 一致せず 75（まだ）に化ける。それでは gh の失敗が onFailure に届かず、毎分ポーリングし続けてしまう。
  # そのため gh の出力を一度変数で受け、gh 自身の終了コードを `|| exit 1` で保持する。
  # 75 に落ちるのは、gh が成功し、状態が OPEN かつ MERGEABLE / UNKNOWN のときだけ。
  - id: wait-merge
    type: poll
    interval: 1m
    run: |
      out=$(gh pr view --json state,mergeable --jq '.state + " " + .mergeable') || {
        echo "gh pr view に失敗しました"
        exit 1
      }
      set -- $out
      case "$1 $2" in
        "MERGED "*) exit 0 ;;
        "CLOSED "*) echo "PR がマージされずに閉じられました"; exit 2 ;;
        *" CONFLICTING") echo "develop と conflict しています"; exit 1 ;;
        *) exit 75 ;;
      esac
    onFailure:
      goto: sync
      maxAttempts: 10
      onExhausted: suspend
      feed: |
        PR が develop と conflict した。develop を取り込み直して解決してください:
        {{ steps.wait-merge.last_stdout }}

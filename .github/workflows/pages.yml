name: Pages

# develop に入ったドキュメントサイト（site/）を GitHub Pages に公開する。
# 公開先は https://todokr.github.io/doctrine/（site/astro.config.mjs の site と base）。
# 型検査とビルドが通るかは CI の site ジョブが PR で見ているので、ここでは公開だけを受け持つ。
on:
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'mise.toml'
  workflow_dispatch:

# 公開は 1 本ずつ。途中の公開を捨てると Pages が中途半端な状態になるので、走っているものは止めない。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ドキュメントサイトのビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: node npm:pnpm

      - name: pnpm store の場所を得る
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm の依存をキャッシュ
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-site-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: pnpm-site-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: GitHub Pages への公開
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

[tools]
# CI（.github/workflows/ci.yml）は jdx/mise-action でこの表を読む。ここが
# 唯一の版の出どころなので、`latest` や `stable` のような動く別名は置かない
# （手元と CI で違う版が入り、再現しない失敗の原因になる）。
# node は公式の配布物を使う。core の単一バイナリ（node --build-sea）は Homebrew の node では作れない。
node = "26.8.1"
# aqua の pnpm レジストリは 11 系の配布物（tarball 化された）に追随できておらず
# `pnpm = "11.15.1"` だと install が 404 で落ちる。npm 経由なら版を指定できる。
# package.json・app/package.json・site/package.json の packageManager と一致させること（食い違うと pnpm 自身が
# packageManager 側の版に入れ替わり、ここの指定が効かなくなる）。
"npm:pnpm" = "11.15.1"
rust = "1.98.1"

# タスクはすべて core/package.json と app/package.json と site/package.json への一行の委譲。実体をここに
# 書き写さないのは、書き写した瞬間に二重管理になるため。
# core と shared はリポジトリ直下の pnpm workspace なので、依存はルートで取る。
[tasks."core:deps"]
description = "core と shared の依存を取る"
run = "pnpm install --frozen-lockfile"

[tasks."core:test"]
description = "コアのテスト"
dir = "core"
run = "pnpm test"

[tasks."core:check"]
description = "コアの型検査"
dir = "core"
run = "pnpm run check"

[tasks."core:install"]
description = "dctld を ~/.local/bin に置く"
dir = "core"
run = "pnpm run install:bin"

[tasks."core:build"]
description = "dctld の単一バイナリを作る"
dir = "core"
run = "pnpm run build"

[tasks.fmt]
description = "core と shared を整形する"
run = "pnpm run fmt"

[tasks."style:check"]
description = "core と shared の整形と lint（CI と同じ）"
run = "pnpm run check:style"

[tasks."app:deps"]
description = "アプリの依存を取る"
dir = "app"
run = "pnpm install --frozen-lockfile"

[tasks."app:dev"]
description = "アプリをブラウザで開く"
dir = "app"
run = "pnpm dev"

[tasks."app:build"]
description = "アプリをビルドする"
dir = "app"
run = "pnpm build"

[tasks."app:test"]
description = "アプリのテスト"
dir = "app"
run = "pnpm test"

[tasks."app:tauri"]
description = "アプリをウィンドウで開く"
dir = "app"
run = "pnpm tauri dev"

# externalBin は tauri.conf.json ではなく tauri.release.conf.json に置いている。
# tauri build は開始時点で同梱物のファイルを要求するので、tauri.conf.json に書くと
# tauri dev と CI の cargo check が落ちる。
# binaries/ に置く dctld は core/dist/dctld のコピーなので core:build に依存する。
# hardenedRuntime は false にしている。SEA の node は JIT の entitlement が無いと
# hardened runtime 下で起動できず、ad-hoc 署名で公証もしないので利点が無い。
[tasks."app:release"]
description = "dctld を同梱した .dmg を作る（Apple Silicon の macOS 専用）"
depends = ["core:build"]
dir = "app"
run = "pnpm run release"

[tasks."app:verify-release"]
description = "作った .app の署名と同梱した dctld の起動を確かめる"
dir = "app"
run = "pnpm run verify:release"

[tasks."site:deps"]
description = "ドキュメントサイトの依存を取る"
dir = "site"
run = "pnpm install --frozen-lockfile"

[tasks."site:dev"]
description = "ドキュメントサイトをブラウザで開く"
dir = "site"
run = "pnpm dev"

[tasks."site:build"]
description = "ドキュメントサイトをビルドする"
dir = "site"
run = "pnpm build"

# worktree 初期化で使う。`mise run setup` を worktree 内で実行する。
# 注意: 新しい worktree のパスは mise にとって未信頼なので、このタスクを呼ぶ前に
# `mise trust`（または MISE_TRUSTED_CONFIG_PATHS）が必要。信頼判定は設定の
# パース時点で走るため、タスク自身が自分の信頼をブートストラップすることはできない
#
# pnpm の lock ファイルはルート（core・shared）・app・site の 3 つにあり、それぞれの隣で
# 走る必要があって 1 つの dir では書けないので、実体を 3 つに割って depends で束ねている。
[tasks.setup]
description = "worktree を作業可能な状態にする（依存の取得）"
depends = ["core:deps", "app:deps", "site:deps"]

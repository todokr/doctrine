<title>doctrine Intake 画面</title>
<!-- PROTOTYPE (使い捨て): docs/superpowers/specs/2026-09-21-intake-ui-design.md の画面を、例のデータで動かしたもの。
     デーモンにはつながっていない。操作はメモリ上のスタブ。§ の印は spec の章番号。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#E7EAEE; --surface:#FFFFFF; --side:#F1F3F6; --surface-2:#E9ECF0; --sunken:#E1E5EA;
  --ink:#181B20; --ink-2:#4B5560; --ink-3:#828C97; --line:#D3D9DF;
  --accent:#AD7625; --accent-soft:#F1E3C9; --accent-text:#20140A; --run:#2E6CA4; --run-bg:#DEEAF5;
  --danger:#AA3A2C; --danger-bg:#F7E2DD; --ok:#296B49; --ok-bg:#DEEFE4;
  --ann:#6C4A9C; --ann-bg:#EEE7F7;
  --shadow:0 12px 32px rgba(20,26,34,.18);
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12151A; --surface:#1A1E24; --side:#20242B; --surface-2:#262B33; --sunken:#0F1215;
    --ink:#E7EAEE; --ink-2:#A7B0BB; --ink-3:#707A85; --line:#2E343D;
    --accent:#E0A857; --accent-soft:#3A2E15; --accent-text:#E0A857; --run:#7FB2E0; --run-bg:#1D2E3E;
    --danger:#E38B7B; --danger-bg:#3B211C; --ok:#7FCB9E; --ok-bg:#16301F;
    --ann:#B79CE8; --ann-bg:#2B2140;
    --shadow:0 12px 32px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12151A; --surface:#1A1E24; --side:#20242B; --surface-2:#262B33; --sunken:#0F1215;
  --ink:#E7EAEE; --ink-2:#A7B0BB; --ink-3:#707A85; --line:#2E343D;
  --accent:#E0A857; --accent-soft:#3A2E15; --accent-text:#E0A857; --run:#7FB2E0; --run-bg:#1D2E3E;
  --danger:#E38B7B; --danger-bg:#3B211C; --ok:#7FCB9E; --ok-bg:#16301F;
  --ann:#B79CE8; --ann-bg:#2B2140;
  --shadow:0 12px 32px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;margin:0;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px}
.hint{color:var(--ink-3);font-size:11.5px}
a{color:var(--accent-text)}

.app{display:grid;grid-template-columns:52px 300px minmax(0,1fr);height:100%;background:var(--surface);overflow:hidden}
.rail{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px}
.rail .grow{flex:1}
.ib{position:relative;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib .pip{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--side)}
.ib.ann-toggle{font-family:var(--mono);font-weight:700;font-size:14px}
.ib.ann-toggle[aria-pressed="true"]{background:var(--ann-bg);color:var(--ann)}

.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;border-bottom:1px solid var(--line)}
.side-head select{border:0;background:var(--side);font-weight:700;font-size:14px;padding:2px 0;max-width:150px}
.side-head .grow{flex:1}
.plus{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.plus:hover{border-color:var(--ink-3)}
.plus[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.side-scroll{overflow-y:auto;flex:1;padding:6px 6px 10px}
.side-foot{border-top:1px solid var(--line);padding:9px 12px 11px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.grp{margin-top:8px}
.grp h3{margin:0;padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center;letter-spacing:.02em}
.grp h3 .count{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.it{width:100%;border:0;background:transparent;border-radius:8px;padding:6px 8px 6px 6px;display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 6px;text-align:left}
.it:hover{background:var(--surface-2)}
.it[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.it .ico{grid-row:span 2;display:grid;place-items:center;height:20px}
.it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.it .t .num{color:var(--ink-3);font-family:var(--mono);font-size:11.5px;margin-right:4px}
.it .m{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:11.5px;min-width:0;flex-wrap:wrap}
.it .m .tm{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.pjdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.diamond{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);border-radius:1.5px}
.bang{width:12px;height:12px;border-radius:50%;background:var(--danger);color:var(--surface);font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1}
.spin{width:12px;height:12px;border-radius:50%;border:2px dotted var(--run);animation:spin 2.4s linear infinite}
.ring{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-3)}
.hourglass{width:10px;height:10px;border-top:3px solid var(--run);border-bottom:3px solid var(--run)}
.check{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.xmark{width:12px;height:12px;border-radius:50%;background:var(--ink-3)}
.prog{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.tag{font-size:10.5px;font-weight:700;padding:0 5px;border-radius:3px;line-height:16px;white-space:nowrap}
.tag.rev{background:var(--run-bg);color:var(--run)}
.tag.intake{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.main{overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.pad{padding:18px 22px;display:grid;gap:14px;align-content:start}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:11.5px}
.crumbs button{border:0;background:transparent;padding:0;color:var(--accent-text);text-decoration:underline;font-size:11.5px}
h1{margin:0;font-size:19px;line-height:1.35;text-wrap:balance}
h1 .num{color:var(--ink-3);font-weight:500;font-family:var(--mono);font-size:15px;margin-right:6px}
.headrow{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;font-weight:700;padding:0 7px;border-radius:4px;line-height:19px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.p-attn{background:var(--accent-soft);color:var(--accent-text)}
.p-danger{background:var(--danger-bg);color:var(--danger)}
.p-run{background:var(--run-bg);color:var(--run)}
.p-muted{background:var(--surface-2);color:var(--ink-2)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 12px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.primary{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.link{border:0;background:transparent;padding:0;color:var(--accent-text);text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.box{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:8px}
.box h2{margin:0;font-size:13px}
.box p{margin:0}
.box.attn{background:var(--accent-soft);border-color:var(--accent)}
.box.danger{background:var(--danger-bg);border-color:var(--danger)}
.box.quiet{background:var(--surface-2);border-color:var(--surface-2)}
pre.block{margin:0;background:var(--sunken);border-radius:7px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre-wrap;max-height:320px;overflow-y:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.ctx{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface)}
details.ctx summary{cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:700;list-style:none}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary::before{content:"▸ ";color:var(--ink-3)}
details.ctx[open] summary::before{content:"▾ "}
details.ctx[open] summary{margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink-3);font-size:11px;font-weight:500;border-top:0;background:var(--surface-2)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;resize:vertical;min-height:54px}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px}
.decide{position:sticky;bottom:0;margin-top:auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;box-shadow:0 -8px 20px rgba(0,0,0,.05)}
.decide .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:12px;margin-bottom:6px}
.decide textarea{min-height:40px}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.4);z-index:30}
.modal{position:fixed;z-index:31;left:50%;top:56px;transform:translateX(-50%);width:min(640px,calc(100% - 32px));max-height:calc(100% - 110px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;display:grid;gap:12px}
.modal h2{margin:0;font-size:16px}
.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.choice input{margin-top:3px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:7px 14px;border-radius:8px;font-size:12.5px;max-width:calc(100% - 24px);text-align:center}

/* spec の章番号 */
.ann{display:none;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ann);background:var(--ann-bg);border-radius:3px;padding:0 5px;line-height:17px;white-space:nowrap;vertical-align:middle}
body.show-ann .ann{display:inline-block}
.ann-note{display:none;border-left:3px solid var(--ann);background:var(--ann-bg);color:var(--ink);padding:6px 10px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.65}
.ann-note b{color:var(--ann);font-family:var(--mono);font-weight:500;margin-right:6px}
body.show-ann .ann-note{display:block}

/* 帯 */
.band{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--run-bg);color:var(--run);border-bottom:1px solid var(--run);padding:7px 22px;font-size:12.5px;font-weight:500}
.band .spacer{flex:1}

/* Issue の選択 */
.picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.issues{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.issue-row{width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:8px 12px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 8px;text-align:left}
.issue-row:first-child{border-top:0}
.issue-row:hover{background:var(--surface-2)}
.issue-row[aria-current="true"]{background:var(--accent-soft)}
.issue-row .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.issue-row .sub{grid-column:2 / 4;color:var(--ink-3);font-size:11.5px}
.issue-body{border:1px solid var(--line);border-radius:9px;padding:14px 16px;display:grid;gap:10px}
.issue-body h2{margin:0;font-size:15px}
.md{line-height:1.75}
.md h3{font-size:12.5px;margin:10px 0 2px}
.md p{margin:4px 0}
.md ul{margin:4px 0;padding-left:20px}
.cmt{border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px}
.cmt .who{font-size:11px;color:var(--ink-3)}

/* 質問 */
.qcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.qcard.missing{border-color:var(--danger);box-shadow:inset 3px 0 0 var(--danger)}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qno{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.qhead h2{margin:0;font-size:14px;flex:1;min-width:240px;text-wrap:balance}
.qkind{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.material{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.material .cap{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.material table{background:var(--surface);border-radius:6px;overflow:hidden}
.material th,.material td{font-size:12px;padding:5px 8px}
.material pre{margin:0;font-family:var(--mono);font-size:11.5px;background:var(--sunken);border-radius:6px;padding:8px 10px;overflow-x:auto}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin:3px 0 0}
.opt .lb{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opt .ds{grid-column:2;color:var(--ink-2);font-size:12px}
.rec{font-size:10.5px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:3px;padding:0 5px;line-height:16px}
.opt .recwhy{color:var(--ok)}
.qextra{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qextra label{display:grid;gap:3px;font-size:11.5px;color:var(--ink-3)}
.qextra textarea{min-height:40px}
.qmissing{color:var(--danger);font-size:12px;margin:0}

/* PFD */
.review-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1750px){.review-body{grid-template-columns:1fr}.review-body .panel{position:static;max-height:none}}
.pfd-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.pfd-scroll{overflow-x:auto}
.pfd{display:block}
.pn{cursor:pointer}
.pn .body{stroke:var(--line);stroke-width:1.3;fill:var(--surface)}
.pn.proc .body{fill:var(--surface)}
.pn.given .body{fill:var(--surface-2)}
.pn.goal .body{stroke-width:2.2;stroke:var(--ink-2)}
.pn .inner{fill:none;stroke:var(--ink-3);stroke-width:1}
.pn text{font-family:var(--sans);font-size:10.5px;fill:var(--ink)}
.pn text.id{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.pn text.mk{font-size:9.5px;font-weight:700;fill:var(--ink-2)}
.pn text.stage{font-family:var(--mono);font-size:9.5px;font-weight:700;fill:var(--ink-3)}
.pn:hover .body{stroke:var(--ink-3)}
.pn.sel .body{stroke:var(--accent);stroke-width:2.6}
.pn.l-waiting .body{stroke-dasharray:4 3}
.pn.l-ready .body{stroke:var(--ink-3);stroke-width:1.5}
.pn.l-running .body{fill:var(--run-bg);stroke:var(--run)}
.pn.l-pr_open .body{fill:var(--run-bg);stroke:var(--run);stroke-width:2.4}
.pn.l-merged .body,.pn.l-done .body{fill:var(--ok-bg);stroke:var(--ok)}
.pn.l-your_turn .body{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}
.pn.l-needs_attention .body{fill:var(--danger-bg);stroke:var(--danger)}
.pn.avail .body{fill:var(--ok-bg)}
.pn.ch-added .body{stroke:var(--ok);stroke-width:2.2}
.pn.ch-changed .body{stroke:var(--accent);stroke-width:2.2}
.pn text.ch-added{fill:var(--ok)}
.pn text.ch-changed{fill:var(--accent)}
.pn.frozen .body{opacity:.72}
.pn .badge circle{fill:var(--accent)}
.pn .badge text{fill:var(--surface);font-size:9.5px;font-weight:700;font-family:var(--mono)}
.pn .lock{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.pn .lockbody{fill:var(--ink-2)}
.pe{fill:none;stroke:var(--ink-3);stroke-width:1.2}
.pe-head{fill:var(--ink-3)}
.pfd-foot{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);align-items:center}
.lg{display:inline-flex;gap:5px;align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.3px solid var(--line);background:var(--surface)}
.stages{display:grid;gap:4px;font-size:12px}
.stages div{display:flex;gap:8px;align-items:baseline}
.stages b{font-family:var(--mono);font-size:11px;color:var(--ink-3);min-width:36px}
.removed{font-size:12px;color:var(--danger)}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;position:sticky;top:0;max-height:calc(100vh - 140px);overflow-y:auto;align-content:start}
.panel h2{margin:0;font-size:14px}
.kv{display:grid;gap:2px}
.kv > span{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.kv > div{line-height:1.7;white-space:pre-wrap}
.linkrow{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 8px;font-size:11.5px;line-height:20px}
.chip:hover{border-color:var(--ink-3)}
.prevc{border-left:2px solid var(--line);padding-left:8px;display:grid;gap:3px;font-size:12px}
.prevc .reply{color:var(--ink-2)}
.prevc .reply::before{content:"↳ エージェント: ";color:var(--ink-3)}
.mycmt{background:var(--accent-soft);border-radius:7px;padding:6px 9px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.mycmt span{flex:1;white-space:pre-wrap}
.turn{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.task-list{display:grid;gap:4px}
.task-list button{text-align:left}

/* 経緯 */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tl li{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:8px;align-items:baseline;font-size:12.5px}
.tl .when{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.tl .dot.h{background:var(--accent)}
.tl .dot.a{background:var(--run)}
.tl .dot.ok{background:var(--ok)}

@media (max-width:1150px){.review-body,.picker{grid-template-columns:1fr}.panel{position:static;max-height:none}}
@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}

function processStages(pfd) {
  const col = {};
  pfd.artifacts.forEach((a) => { if (a.given) col["a:" + a.id] = 0; });
  let changed = true;
  while (changed) {
    changed = false;
    for (const p of pfd.processes) {
      if (col["p:" + p.id] !== undefined) continue;
      if (!p.inputs.every((i) => col["a:" + i] !== undefined)) continue;
      const c = Math.max(...p.inputs.map((i) => col["a:" + i])) + 1;
      col["p:" + p.id] = c;
      p.outputs.forEach((o) => { col["a:" + o] = c + 1; });
      changed = true;
    }
  }
  return col;
}
function diff(cur, prev) {

  const c = idx(cur), p = idx(prev);
  for (const k in c) { if (!p[k]) ch[k] = "added"; else if (JSON.stringify(c[k]) !== JSON.stringify(p[k])) ch[k] = "changed"; }
  for (const k in p) if (!c[k]) removed.push({ key: k, name: p[k].name });
  return { ch, removed };
}

}

  return qs.map((q, i) => {
    const a = ans[q.id] || {};
    let v;
    if (q.kind === "free") v = a.text || "（未回答）";
    else {
      const labels = (a.sel || []).map((id) => q.options.find((o) => o.id === id).label);
      if (a.other) labels.push(`その他: ${a.other}`);
      v = labels.join(" / ") || "（未回答）";
    }
    return `Q${i + 1}. ${q.prompt}\n回答: ${v}${a.note ? `\n補足: ${a.note}` : ""}`;
  }).join("\n\n");
}
function answerIssues(qs, ans) {
  const out = [];
  for (const q of qs) {
    const a = ans[q.id] || {};
    if (q.kind === "free") { if (!(a.text || "").trim()) out.push(q.id); continue; }
    const n = (a.sel || []).length + (a.other?.trim() ? 1 : 0);
    if (n === 0 || (q.kind === "single" && n > 1)) out.push(q.id);
  }
  return out;
}

/* ---------- PFD の図（6 章） ---------- */
function wrapText(s, n) {
  const out = []; let cur = "";
  for (const ch of s) { if (cur.length >= n) { out.push(cur); cur = ""; } cur += ch; }
  if (cur) out.push(cur);
  if (out.length > 2) { out.length = 2; out[1] = out[1].slice(0, n - 1) + "…"; }
  return out;
}
function pfdSvg(it, pfd, o) {
  const col = processStages(pfd);
  const cols = {};
  const nodes = [];
  pfd.artifacts.forEach((a) => nodes.push({ key: "a:" + a.id, kind: "a", d: a }));
  pfd.processes.forEach((p) => nodes.push({ key: "p:" + p.id, kind: "p", d: p }));
  nodes.forEach((n) => { const c = col[n.key] ?? 0; (cols[c] = cols[c] || []).push(n); });
  const maxC = Math.max(...Object.keys(cols).map(Number));
  const W = { a: 112, p: 130 }, H = { a: 42, p: 46 }, GAP = 26, ROW = 66;
  const colX = []; let x = 16;
  for (let c = 0; c <= maxC; c++) { colX[c] = x; x += (c % 2 ? W.p : W.a) + GAP; }
  const maxRows = Math.max(...Object.values(cols).map((l) => l.length));
  const height = maxRows * ROW + 24;
  const pos = {};
  for (const c in cols) {
    const l = cols[c]; const off = (maxRows - l.length) * ROW / 2 + 16;
    l.forEach((n, i) => { const w = W[n.kind], h = H[n.kind]; pos[n.key] = { x: colX[c] + (c % 2 ? 0 : (W.p - W.a) / 2 * 0), y: off + i * ROW, w, h, n }; });
  }
  const width = x - GAP + 24;
  const av = o.statuses ? available(pfd, o.statuses) : null;
  let edges = "";
  for (const p of pfd.processes) {
    const P = pos["p:" + p.id];
    const line = (A, B) => {
      const x1 = A.x + A.w, y1 = A.y + A.h / 2, x2 = B.x - 6, y2 = B.y + B.h / 2, m = (x1 + x2) / 2;
      return `<path class="pe" d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}" marker-end="url(#ah)" />`;
    };
    p.inputs.forEach((a) => { if (pos["a:" + a]) edges += line(pos["a:" + a], P); });
    p.outputs.forEach((a) => { if (pos["a:" + a]) edges += line(P, pos["a:" + a]); });
  }
  const cc = o.comments || {};
  const stageOf = (key) => (col[key] + 1) / 2;
  let body = "";
  for (const key in pos) {
    const { x, y, w, h, n } = pos[key];
    const d = n.d, cls = ["pn", n.kind === "p" ? "proc" : "art"];
    const human = n.kind === "p" && d.actor === "human";
    const goal = n.kind === "a" && pfd.goal.includes(d.id);
    if (n.kind === "a" && d.given) cls.push("given");
    if (goal) cls.push("goal");
    let look = null;
    if (n.kind === "p" && o.statuses) { look = o.statuses[d.id]; cls.push("l-" + look); }
    if (n.kind === "a" && av && av.has(d.id) && !d.given) cls.push("avail");
    const ch = o.changes?.[key]; if (ch) cls.push("ch-" + ch);
    const frozen = o.frozen?.has(key); if (frozen) cls.push("frozen");
    if (o.selected === key) cls.push("sel");
    const rx = n.kind === "p" ? h / 2 : 4;
    const lines = wrapText(d.name, n.kind === "p" ? 10 : 8);
    const ty = y + h / 2 + (lines.length === 1 ? 4 : -2);
    const marks = [];
    if (n.kind === "a" && d.given && !d.decision) marks.push("既存");
    if (n.kind === "a" && d.decision) marks.push("決定");
    if (human) marks.push("人");
    if (goal) marks.push("◎");
    if (look && LOOK[look].mark) marks.push(LOOK[look].mark);
    body += `<g class="${cls.join(" ")}" role="button" tabindex="0" data-node="${key}" aria-label="${esc(d.name)}">
      <rect class="body" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" />
      ${human ? `<rect class="inner" x="${x + 3}" y="${y + 3}" width="${w - 6}" height="${h - 6}" rx="${rx - 3}" />` : ""}
      ${lines.map((l, i) => `<text x="${x + w / 2}" y="${ty + i * 13}" text-anchor="middle">${esc(l)}</text>`).join("")}
      ${n.kind === "p" ? `<text class="stage" x="${x + 14}" y="${y - 4}">段${stageOf(key)}</text><text class="id" x="${x + w - 14}" y="${y - 4}" text-anchor="end">${d.id}</text>` : ""}
      ${marks.length ? `<text class="mk" x="${x + (n.kind === "p" ? 16 : 6)}" y="${y + h + 12}">${esc(marks.join(" · "))}</text>` : ""}
      ${ch ? `<text class="mk ch-${ch}" x="${x + w - 4}" y="${y + h + 12}" text-anchor="end">${ch === "added" ? "＋ 追加" : "～ 変更"}</text>` : ""}
      ${frozen ? `<g transform="translate(${x + w - 16},${y + 5})"><path class="lock" d="M2 5V3.5a3 3 0 0 1 6 0V5" /><rect class="lockbody" x="0.5" y="5" width="9" height="7" rx="1.5" /></g>` : ""}
      ${cc[key] ? `<g class="badge"><circle cx="${x + w - 2}" cy="${y + 2}" r="8" /><text x="${x + w - 2}" y="${y + 5.5}" text-anchor="middle">${cc[key]}</text></g>` : ""}
    </g>`;
  }
  return `<svg class="pfd" width="${width}" height="${height + 12}" viewBox="0 0 ${width} ${height + 12}" role="img" aria-label="PFD の図">
    <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="pe-head" d="M0 0L8 4L0 8z" /></marker></defs>
    ${edges}${body}</svg>`;
}
function pfdBlock(it, pfd, o) {

      <span class="lg"><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="var(--accent)" /><text x="8" y="11.5" font-size="9" fill="var(--surface)" text-anchor="middle" font-family="var(--mono)" font-weight="700">2</text></svg>コメントの数</span>
    </div>
    ${legendStates ? `<div class="pfd-foot">${legendStates}</div>` : ""}
    ${o.removed?.length ? `<div class="removed">前の案から消えた要素: ${o.removed.map((r) => esc(r.name)).join("、")} ${ann("6.7")}</div>` : ""}
  </div>`;
}

/* ---------- 要素の欄（7.2） ---------- */
function elementPanel(it, pfd, key, o) {

        <div class="actions"><button class="btn sm" data-addcmt="${key}">コメントを付ける</button></div></div>`;
  return `<aside class="panel">${head}${rows}
    ${prevs.length ? `<div class="kv"><span>前の回のコメントと返答 ${ann("7.6")}</span>${prevs.map((c) => `<div class="prevc"><span>${esc(c.body)}</span><span class="reply">${esc(c.reply)}</span></div>`).join("")}</div>` : ""}

function progressLinks(it, id) {

  const pr = it.prs?.[id];
  const none = '<span class="hint">なし</span>';
  return `<div class="kv"><span>sub-issue ${ann("8.2")}</span><div>${it.subs?.[id] ? `<a href="#" data-toast="sub-issue #${it.subs[id]} を開く（例）">#${it.subs[id]}</a>` : none}</div></div>
    <div class="kv"><span>タスク</span><div class="task-list">${tasks.map((t, i) => `<button class="btn link" data-gotask="${t.id.replace("…", "")}">${t.id}（${t.st}）${i ? "・以前" : ""}</button>`).join("") || none}</div></div>
    <div class="kv"><span>PR</span><div>${pr ? `<a href="#" data-toast="PR #${pr[0]} を開く（例）">#${pr[0]}（${pr[1]}）</a>` : none}</div></div>`;
}
function promptFor(pfd, p) {
  const nm = (id) => pfd.artifacts.find((a) => a.id === id);
  const given = p.inputs.map(nm).filter((a) => !a.decision);
  const dec = p.inputs.map(nm).filter((a) => a.decision);
  return `https://github.com/example/app/issues/88 ${pfd.title}
sub-issue: （承認のときに作られる）

この作業は、上の Issue を分解したうちの 1 つである。

## 目的
${p.purpose}

## 前提
すでに baseBranch にあるもの:
${given.map((a) => `- ${a.name}: ${a.description || ""}`).join("\n") || "- なし"}
${dec.length ? `\n人が決めたこと:\n${dec.map((a) => `- ${a.name}: ${a.description}`).join("\n")}\n` : ""}
## 作るもの
${p.outputs.map(nm).map((a) => `- ${a.name}: ${a.description}\n  確かめ方: ${a.verify}`).join("\n")}

## 手順
${p.steps}

## 完了条件
${p.done_when}`;
}

/* ---------- 各面 ---------- */
function renderMain() {
  const m = document.getElementById("main");
  if (S.view === "tasks") { m.innerHTML = taskFace(); return; }
  if (S.sel === "new") { m.innerHTML = pickerFace(); return; }
  const it = byId(S.sel);
  const faces = { investigating: progressRunFace, decomposing: progressRunFace, answering: questionFace, reviewing: reviewFace, needs_attention: attentionFace, active: activeFace, completed: activeFace, canceled: activeFace };
  m.innerHTML = band(it) + faces[it.state](it);
}

            <div class="actions"><input type="text" id="issue-direct" placeholder="#123 / 123 / https://github.com/…/issues/123" style="flex:1" /><button class="btn sm" data-act="direct">選ぶ</button></div></div>
        </div>

function progressRunFace(it) {

function questionFace(it) {
  const ans = S.answers[it.id] || (S.answers[it.id] = {});
  const missing = S.tried ? answerIssues(QUESTIONS_91, ans) : [];
  const cards = QUESTIONS_91.map((q, i) => {
    const a = ans[q.id] || {};
    const mat = q.material.kind === "table"
      ? `<span class="cap">${esc(q.material.caption)}</span><div style="overflow-x:auto"><table><tr>${q.material.head.map((h) => `<th>${h}</th>`).join("")}</tr>${q.material.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`
      : q.material.kind === "code" ? `<span class="cap">${esc(q.material.caption)}・<span class="mono">${q.material.path}</span></span><pre>${esc(q.material.code)}</pre>`
      : `<span class="cap">背景</span><div>${esc(q.material.body)}</div>`;
    const opts = q.kind === "free"
      ? `<textarea data-free="${q.id}" placeholder="答えを書く">${esc(a.text || "")}</textarea>`
      : `<div class="opts">${q.options.map((o) => {
          const on = (a.sel || []).includes(o.id);
          return `<label class="opt ${on ? "on" : ""}"><input type="${q.kind === "single" ? "radio" : "checkbox"}" name="${q.id}" data-opt="${q.id}|${o.id}" ${on ? "checked" : ""} />
            <span class="lb">${esc(o.label)}${q.rec?.option === o.id ? '<span class="rec">推奨</span>' : ""}</span>${o.desc ? `<span class="ds">${esc(o.desc)}</span>` : ""}${q.rec?.option === o.id ? `<span class="ds recwhy">${esc(q.rec.reason)}</span>` : ""}</label>`;
        }).join("")}</div>`;
    const rec = q.kind === "free" && q.rec ? `<div class="opt" style="cursor:default"><span></span><span class="lb">${esc(q.rec.text)}<span class="rec">推奨</span></span><span class="ds recwhy">${esc(q.rec.reason)}</span></div>` : "";
    return `<section class="qcard ${missing.includes(q.id) ? "missing" : ""}">
      <div class="qhead"><span class="qno">Q${i + 1}</span><h2>${esc(q.prompt)}</h2><span class="qkind">${{ single: "単一選択", multiple: "複数選択", free: "自由記述" }[q.kind]}</span></div>
      <div class="material">${mat}</div>${i === 0 ? ann("5.1 判断材料は選択肢より先") : ""}
      ${opts}${rec}${i === 0 ? ann("5.2 推奨は初めから選ばない") : ""}
      ${q.kind === "free" ? "" : `<div class="qextra"><label>その他（選択肢以外の答え）<textarea data-other="${q.id}">${esc(a.other || "")}</textarea></label><label>補足<textarea data-note="${q.id}">${esc(a.note || "")}</textarea></label></div>`}
      ${missing.includes(q.id) ? '<p class="qmissing">まだ答えていません（single は 1 つだけ選べます）</p>' : ""}</section>`;
  }).join("");
  const n = answerIssues(QUESTIONS_91, ans).length;
  return `<div class="pad">${header(it, `<span class="hint">1 回目の質問・3 件</span>`)}
    ${cards}</div>
    <div class="decide"><div><div class="meta"><span>未回答 ${n} 件</span>${ann("5.3 answerIssues")}</div></div>
      <div class="actions"><button class="btn primary" data-act="answer-open">回答を送る…</button></div></div>`;
}

function reviewFace(it) {

</div></div>`;
}

function attentionFace(it) {

[10:04:51] 要確認にしました（invalid_output）</pre></details>

function activeFace(it) {
  const pfd = it.revising && it.revPfd ? it.revPfd : it.pfd;
  const key = S.node[it.id] || null;

  const turnHtml = !done && turns.length ? `<section style="display:grid;gap:8px"><div class="headrow"><h2 style="margin:0;font-size:14px">操作が必要</h2>${ann("8.1")}</div><div class="turn">${turns.map((p) => {
      if (it.statuses[p.id] === "your_turn") {
        return `<div class="box attn"><div class="headrow"><span class="diamond"></span><h2>${p.id} ${esc(p.name)}</h2><span class="pill p-attn">あなたの番</span></div>

          <textarea id="note-${p.id}" data-hnote="${it.id}|${p.id}" placeholder="例: 件名は「【○○】通知設定が変わりました」…">${esc(S.notes[it.id + p.id] || "")}</textarea>
          <div class="actions"><button class="btn primary" data-human="${p.id}" ${(S.notes[it.id + p.id] || "").trim() ? "" : "disabled"}>完了を記録する</button></div></div>`;
      }
      return `<div class="box danger"><div class="headrow"><span class="bang">!</span><h2>${p.id} ${esc(p.name)}</h2><span class="pill p-danger">要確認</span></div>
        <p>${ATTN[it.attnWhy[p.id]]}。</p><div class="actions"><button class="btn link" data-gotask="5f9d">タスク 5f9d を開く</button><span class="spacer"></span><button class="btn" data-redispatch="${p.id}">再投入する</button></div>
</div>`;
    }).join("")}</div></section>` : "";
  const watch = it.watchFail && !done ? `<div class="box quiet"><div class="headrow"><h2>GitHub の確認に ${it.watchFail} 回続けて失敗しています</h2>${ann("8.3 見張りの健全さ")}</div>
      <p class="mono">gh: HTTP 502 Bad Gateway（11:42）</p><p class="hint">最後に成功: 11:38</p></div>` : "";
  const ops = done
    ? `<div class="box attn"><h2>完了しました ${ann("8.7")}</h2>
        <div class="actions"><button class="btn primary" data-toast="Issue を閉じた（例）">Issue を閉じる</button></div></div>`
    : revMode
      ? `<div class="box attn"><h2>改訂 ${ann("8.5")}</h2>
          <div class="actions"><button class="btn primary" data-act="rev-start" ${(S.drafts[it.id] || []).length ? "" : "disabled"}>改訂を始める</button><button class="btn" data-act="rev-cancel">やめる</button></div></div>`
      : `<div class="actions">${ann("8.4 操作")}<button class="btn sm" data-toast="intake.refresh: いま確認した（例）">いま確認する</button>
          <button class="btn sm" data-act="pause">${S.paused[it.id] ? "自動投入を再開" : "自動投入を一時停止"}</button>
          <button class="btn sm" data-act="rev-mode" ${it.revising ? "disabled" : ""}>改訂に入る…</button>
          ${S.paused[it.id] ? '<span class="pill p-muted">自動投入は一時停止中</span>' : ""}</div>`;
  return `<div class="pad">${header(it, `<span class="prog">${progress(it)} 完了</span>`)}
    ${turnHtml}${watch}${ops}
    <div class="review-body">
      ${pfdBlock(it, it.pfd, { statuses: it.statuses, selected: key, comments: commentCounts(it), frozen })}
      ${elementPanel(it, it.pfd, key, { statuses: it.statuses, frozen, readOnly: !revMode })}

    </div>`;
}

function taskFace() {

    <div class="headrow"><h1>${esc(t.title)}</h1><span class="pill ${{ review: "p-attn", check: "p-danger", running: "p-run", queued: "p-muted" }[t.st]}">${{ review: "レビュー待ち", check: "要確認", running: "実行中", queued: "待ち" }[t.st]}</span></div>

  } else if (S.modal === "reject") {
    inner = `<h2>この文面で差し戻します ${ann("7.4 buildFeedback")}</h2>
      <pre class="block">${esc(buildFeedback(it.pfd, S.drafts[it.id] || []))}</pre>
      <div class="actions"><span class="spacer"></span><button class="btn" data-act="close">戻る</button><button class="btn danger" data-act="reject-send">差し戻す</button></div>`;

  o.innerHTML = `<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-modal="true">${inner}</div>${t}`;

/* ---------- 全体 ---------- */
function render() {
  document.body.classList.toggle("show-ann", S.ann);
  renderRail(); renderSide(); renderMain(); renderOverlay();
}
let toastTimer;
function toast(msg) { S.toast = msg; renderOverlay(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderOverlay(); }, 2600); }
function later(fn, ms = 1400) { setTimeout(() => { fn(); render(); }, ms); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-view],[data-sel],[data-closed],[data-node],[data-act],[data-toast],[data-pick],[data-assignee],[data-addcmt],[data-del],[data-rec],[data-human],[data-redispatch],[data-gotask],[data-task],[data-back]");
  if (!t) return;
  const d = t.dataset;
  const it = byId(S.sel);
  if (d.toast) { e.preventDefault(); toast(d.toast); return; }
  if (d.view) { S.view = d.view; }
  else if (d.sel !== undefined && !t.closest(".panel")) { S.sel = d.sel; S.view = "intake"; }
  else if (d.closed !== undefined) { S.showClosed = d.closed === "1"; }
  else if (d.node !== undefined) { S.node[S.sel] = d.node || null; }
  else if (d.pick) { S.picked = Number(d.pick); }
  else if (d.assignee) { S.assignee = d.assignee; }
  else if (d.task) { S.taskSel = d.task; }
  else if (d.gotask) { S.view = "tasks"; S.taskSel = d.gotask; toast("タスクのビューへ移った"); }
  else if (d.back) { S.view = "intake"; S.sel = d.back; }
  else if (d.addcmt) {
    const box = document.getElementById(d.addcmt === "whole" ? "whole" : "cmt-" + d.addcmt);
    const body = box?.value.trim();
    if (!body) { toast("コメントを書いてから付けてください"); return; }
    (S.drafts[S.sel] = S.drafts[S.sel] || []).push({ target: d.addcmt, body });
  }
  else if (d.del) { const [k, i] = d.del.split("|"); const list = S.drafts[S.sel]; const mine = list.filter((c) => c.target === k); list.splice(list.indexOf(mine[Number(i)]), 1); }
  else if (d.rec) {
    const q = QUESTIONS_91.find((x) => x.id === d.rec); const a = (S.answers[S.sel][q.id] = S.answers[S.sel][q.id] || {});
    if (q.kind === "free") a.text = q.rec.text; else a.sel = [q.rec.option];
  }
  else if (d.human) {
    const v = (S.notes[S.sel + d.human] || "").trim();
    if (!v) { toast("決めた内容を書いてください（空白だけは記録できません）"); return; }
    it.statuses[d.human] = "done"; toast("完了を記録した。sub-issue #" + it.subs[d.human] + " を閉じ、下流の判定を走らせた（例）");
  }
  else if (d.redispatch) { it.statuses[d.redispatch] = "running"; it.tasks[d.redispatch].unshift({ id: "9a0b…", st: "running" }); toast("再投入した。新しいタスク 9a0b が同じ sub-issue に紐づいた（例）"); }
  else if (d.act) {
    const a = d.act;
    if (a === "ann") S.ann = !S.ann;
    else if (a === "close") S.modal = null;
    else if (a === "cancel") S.modal = "cancel";
    else if (a === "cancel-send") { S.modal = null; it.state = "canceled"; it.revising = false; toast("中止した（例）"); }
    else if (a === "ghdown") S.ghDown = !S.ghDown;
    else if (a === "gh-retry") toast("github.status を取り直した（例）");

    else if (a === "start") {
      const n = { id: "i99", num: 99, title: "エクスポートの形式に JSON を足す", pj: "doctrine", state: "investigating", ago: "たった今", history: [["今", "h", "Intake を開始した"]] };

    }
    else if (a === "answer-open") {

      if (answerIssues(QUESTIONS_91, S.answers[S.sel] || {}).length) { toast("まだ答えていない質問があります"); render(); return; }
      S.modal = "answer";
    }
    else if (a === "answer-send") {
      S.modal = null; it.state = "decomposing"; it.history.push(["今", "h", "質問に答えた（3 件）"]); toast("回答を送った。分解が始まる（例）");
      later(() => { it.state = "reviewing"; it.seq = 1; it.pfd = PFD_91; it.ago = "たった今"; it.history.push(["今", "a", "1 回目の案を出した（プロセス 3）"]); });
    }
    else if (a === "reject-open") S.modal = "reject";
    else if (a === "reject-send") {
      S.modal = null; const n = (S.drafts[S.sel] || []).length; S.drafts[S.sel] = []; it.state = "decomposing"; it.history.push(["今", "h", `差し戻した（コメント ${n} 件）`]); toast("差し戻した。同じ会話の続きとして届く（例）");
      later(() => { it.state = "reviewing"; it.seq = (it.seq || 1) + 1; it.ago = "たった今"; it.history.push(["今", "a", `${it.seq} 回目の案を出した`]); });
    }
    else if (a === "approve") {
      const n = (S.drafts[S.sel] || []).length; S.drafts[S.sel] = [];
      if (it.revising) {
        it.revising = false; it.pfd = it.revPfd; it.statuses["7"] = "waiting"; it.state = "active"; it.history.push(["今", "h", "改訂を承認した。sub-issue を整え、投入を再開した"]);
      } else {
        const av = new Set(it.pfd.artifacts.filter((x) => x.given).map((x) => x.id));
        it.statuses = {}; it.tasks = {}; it.subs = {}; let s = 400;
        for (const p of it.pfd.processes) {
          it.subs[p.id] = s++;
          const ready = p.inputs.every((i) => av.has(i));
          it.statuses[p.id] = ready ? (p.actor === "human" ? "your_turn" : "running") : "waiting";
          if (ready && p.actor !== "human") it.tasks[p.id] = [{ id: "n" + p.id + "…", st: "running" }];
        }
        it.state = "active"; it.prev = null; it.history.push(["今", "h", `承認した（${it.seq} 回目の案）`], ["今", "a", "sub-issue を作り、着手できるプロセスを投入した"]);
      }
      toast(n ? `承認した。送っていないコメント ${n} 件は捨てた（例）` : "承認した（例）");
    }
    else if (a === "retry") { it.state = "decomposing"; toast("やり直した（例）"); }
    else if (a === "pause") S.paused[S.sel] = !S.paused[S.sel];
    else if (a === "rev-mode") { S.revMode[S.sel] = true; S.node[S.sel] = null; }
    else if (a === "rev-cancel") { S.revMode[S.sel] = false; S.drafts[S.sel] = []; }
    else if (a === "rev-start") {
      S.revMode[S.sel] = false; S.drafts[S.sel] = []; it.revising = true; it.state = "decomposing"; it.history.push(["今", "h", "改訂を始めた"]); toast("改訂を始めた。自動投入は止まる（例）");
      later(() => {
        it.state = "reviewing"; it.seq = 3; it.revPfd = PFD_76_REV; it.prevPfd = it.pfd; it.ago = "たった今";
        it._saved = { pfd: it.pfd }; it.pfd = PFD_76_REV; it.prev = PFD_76; it.prevComments = [{ target: "p:5", label: "プロセス 5", body: "Slack の欄は後回しにして、メールだけで先に出したい", reply: "5 をメールだけにし、Slack の欄を 7 に分けました" }];
        it.history.push(["今", "a", "改訂の案を出した"]);

    }
    else if (a === "abandon") {
      it.revising = false; it.state = "active"; if (it._saved) { it.pfd = it._saved.pfd; } it.prev = null; it.prevComments = null; toast("改訂をやめ、元の承認済みの計画に戻った（例）");
    }

});
document.addEventListener("keydown", (e) => {

document.addEventListener("change", (e) => {

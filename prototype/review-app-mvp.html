<title>doctrine レビュー</title>
<!-- PROTOTYPE (使い捨て): docs/superpowers/specs/2026-09-13-review-app-design.md の第1段階（MVP）に沿った画面確認用。
     データはすべてモック、操作はメモリ/localStorage 上のスタブで、デーモンにはつながっていない。
     「見た」印・コンポーザ・worktree警告ビュー・一時停止再開など、specで第2段階に回した機能は含めていない。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E7EAEE; --surface:#FFFFFF; --side:#F1F3F6; --surface-2:#E9ECF0; --sunken:#E1E5EA;
  --ink:#181B20; --ink-2:#4B5560; --ink-3:#828C97; --line:#D3D9DF;
  --accent:#AD7625; --accent-ink:#20140A; --accent-soft:#F1E3C9;  --run:#2E6CA4; --run-bg:#DEEAF5;
  --danger:#AA3A2C; --danger-bg:#F7E2DD;
  --degraded:#6C4A9C; --degraded-bg:#EAE2F5;
  --ok:#296B49; --ok-bg:#DEEFE4;
  --add-bg:#E1F0E5; --add-gutter:#C9E3D1; --del-bg:#F7E4E0; --del-gutter:#EFC9C2;
  --kw:#7A4AA0; --str:#2B7A4B; --com:#8B93A0; --num:#A05A22;
  --shadow:0 12px 32px rgba(20,26,34,.18);
  --bar:#181B20; --bar-ink:#F1F3F6;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12151A; --surface:#1A1E24; --side:#20242B; --surface-2:#262B33; --sunken:#0F1215;
    --ink:#E7EAEE; --ink-2:#A7B0BB; --ink-3:#707A85; --line:#2E343D;
    --accent:#E0A857; --accent-ink:#241804; --accent-soft:#3A2E15;    --run:#7FB2E0; --run-bg:#1D2E3E;
    --danger:#E38B7B; --danger-bg:#3B211C;
    --degraded:#B79CE8; --degraded-bg:#2B2140;
    --ok:#7FCB9E; --ok-bg:#16301F;
    --add-bg:#173322; --add-gutter:#1F452E; --del-bg:#3A2019; --del-gutter:#4A2921;
    --kw:#C79EE8; --str:#8FDBA9; --com:#707A85; --num:#E0A067;
    --shadow:0 12px 32px rgba(0,0,0,.55);
    --bar:#E7EAEE; --bar-ink:#12151A;
  }
}
:root[data-theme="dark"]{
  --ground:#12151A; --surface:#1A1E24; --side:#20242B; --surface-2:#262B33; --sunken:#0F1215;
  --ink:#E7EAEE; --ink-2:#A7B0BB; --ink-3:#707A85; --line:#2E343D;
  --accent:#E0A857; --accent-ink:#241804; --accent-soft:#3A2E15;  --run:#7FB2E0; --run-bg:#1D2E3E;
  --danger:#E38B7B; --danger-bg:#3B211C;
  --degraded:#B79CE8; --degraded-bg:#2B2140;
  --ok:#7FCB9E; --ok-bg:#16301F;
  --add-bg:#173322; --add-gutter:#1F452E; --del-bg:#3A2019; --del-gutter:#4A2921;
  --kw:#C79EE8; --str:#8FDBA9; --com:#707A85; --num:#E0A067;
  --shadow:0 12px 32px rgba(0,0,0,.55);
  --bar:#E7EAEE; --bar-ink:#12151A;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;padding-inline:16px;padding-block:12px 78px;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px}
.hint{color:var(--ink-3);font-size:11.5px}

.wrap{max-width:1600px;margin-inline:auto;display:grid;gap:10px}

.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:9px 12px;display:flex;gap:10px;align-items:center;color:var(--ink)}
.banner strong{color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 6px;font-size:11px;letter-spacing:.03em}
.banner p{margin:0;flex:1;min-width:0}
.banner button{border:0;background:transparent;color:var(--ink-2);font-size:16px;line-height:1;padding:2px 4px}

.app{display:grid;grid-template-columns:52px 288px minmax(0,1fr);height:calc(100vh - 118px);min-height:560px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}}

/* icon rail */
.rail{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px}
.rail .grow{flex:1}
.ib{position:relative;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib .pip{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--side)}
@media (max-width:900px){.rail{flex-direction:row;justify-content:flex-start;padding-inline:8px;border-right:0;border-bottom:1px solid var(--line)}.rail .grow{display:none}}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;border-bottom:1px solid var(--line)}
.side-head select{border:0;background:transparent;font-weight:700;font-size:14px;padding:2px 0;max-width:170px}
.side-head .count{color:var(--ink-3);font-variant-numeric:tabular-nums}
.side-head .grow{flex:1}
.plus{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.plus:hover{border-color:var(--ink-3)}
.side-scroll{overflow-y:auto;flex:1;padding:6px 6px 10px}
@media (max-width:900px){.side{border-right:0;border-bottom:1px solid var(--line)}.side-scroll{max-height:320px}}
.grp{margin-top:8px}
.grp h3{margin:0;padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center;letter-spacing:.02em}
.grp h3 .count{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.it{width:100%;border:0;background:transparent;border-radius:8px;padding:6px 8px 6px 6px;display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 6px;text-align:left}
.it:hover{background:var(--surface-2)}
.it[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.it .ico{grid-row:span 2;display:grid;place-items:center;height:20px}
.it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.it .m{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:11.5px;min-width:0}
.it .m .pj{display:inline-flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m .tm{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.pjdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.diamond{width:9px;height:9px;background:var(--accent);transform:rotate(45deg);border-radius:1.5px}
.bang{width:12px;height:12px;border-radius:50%;background:var(--danger);color:var(--surface);font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1}
.bang.deg{background:var(--degraded)}
.spin{width:12px;height:12px;border-radius:50%;border:2px dotted var(--run);animation:spin 2.4s linear infinite}
.ring{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-3)}
.pause{width:10px;height:10px;border-left:3px solid var(--ink-2);border-right:3px solid var(--ink-2)}
.check{width:12px;height:12px;border-radius:50%;background:var(--ok);position:relative}
.xmark{width:12px;height:12px;border-radius:50%;background:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.side-foot{border-top:1px solid var(--line);padding:7px 12px;color:var(--ink-3);font-size:11px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.side-foot b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}

/* main */
.main{overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.pad{padding:18px 22px;display:grid;gap:14px;align-content:start}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:11.5px}
h1{margin:0;font-size:19px;line-height:1.35;text-wrap:balance}
.headrow{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;font-weight:700;padding:0 7px;border-radius:4px;line-height:19px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.p-attn{background:var(--accent-soft);color:var(--accent-ink)}
.p-danger{background:var(--danger-bg);color:var(--danger)}
.p-deg{background:var(--degraded-bg);color:var(--degraded)}
.p-run{background:var(--run-bg);color:var(--run)}
.p-muted{background:var(--surface-2);color:var(--ink-2)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 12px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.primary{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.box{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:8px}
.box h2{margin:0;font-size:13px}
.box p{margin:0}
.box.attn{background:var(--accent-soft);border-color:var(--accent)}
.box.danger{background:var(--danger-bg);border-color:var(--danger)}
.box.deg{background:var(--degraded-bg);border-color:var(--degraded)}
.box.quiet{background:var(--surface-2);border-color:var(--surface-2)}
pre.block{margin:0;background:var(--sunken);border-radius:7px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre;max-height:320px;overflow-y:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.ctx{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface)}
details.ctx summary{cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:700;list-style:none}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary::before{content:"▸ ";color:var(--ink-3)}
details.ctx[open] summary::before{content:"▾ "}
details.ctx[open] summary{margin-bottom:8px}
details.runs summary{cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:700}
.runtable{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--ink-3);font-size:11px;font-weight:500;border-top:0;background:var(--surface-2)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}

/* review */
.rv-files-md{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.rv-files-md header{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.md{padding:6px 18px 14px;max-width:72ch;line-height:1.75}
.md h1{font-size:16px;margin:10px 0 4px}
.md h2{font-size:13.5px;margin:14px 0 2px}
.md ul,.md ol{margin:4px 0;padding-left:22px}
.md p{margin:4px 0}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.rv-body{display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1150px){.rv-body{grid-template-columns:1fr}}
.rv-body.has-guide{grid-template-columns:220px minmax(0,1fr) 360px}
@media (max-width:1500px){.rv-body.has-guide{grid-template-columns:1fr}}
@media (max-width:1150px){.rv-body.has-guide{grid-template-columns:1fr}}

/* Review Guide */
.guide{border:1px solid var(--accent);border-radius:9px;background:var(--surface);padding:14px;display:grid;gap:16px;align-content:start;position:sticky;top:0;max-height:calc(100vh - 160px);overflow-y:auto}
@media (max-width:1500px){.guide{position:static;max-height:none}}
.guide-head{display:grid;gap:3px}
.guide-head b{font-size:13px}
.g-timeline{display:flex;align-items:center;flex-wrap:wrap;font-size:10.5px;gap:0}
.g-step{display:flex;align-items:center;gap:4px;color:var(--ink-3);white-space:nowrap}
.g-step.done{color:var(--ok)}
.g-step.cur{color:var(--accent-ink);font-weight:700}
.g-dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.g-rule{flex:0 0 14px;height:1px;background:var(--line);margin:0 3px}
.g-sec{display:grid;gap:7px;animation:g-in .45s ease both;animation-delay:calc(var(--gi) * 70ms)}
.g-sec h3{margin:0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.g-sec p{margin:0;line-height:1.75}
@keyframes g-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.g-sec{animation:none}}
.g-table{width:100%;border-collapse:collapse;font-size:11.5px}
.g-table th,.g-table td{padding:4px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal}
.g-table th{background:var(--surface-2);color:var(--ink-3);font-weight:500;border-top:0}
.g-order{margin:0;padding-left:0;list-style:none;display:grid;gap:5px;counter-reset:go}
.g-order li{counter-increment:go}
.g-order button{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;text-align:left;display:grid;gap:1px}
.g-order button::before{content:counter(go) ". ";color:var(--accent-ink);font-weight:700}
.g-order button:hover{border-color:var(--ink-3)}
.g-order .nm{font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}
.g-warn{background:var(--accent-soft);color:var(--accent-ink);border-radius:7px;padding:6px 8px;font-size:11.5px;margin:0}
.g-ok{color:var(--ok);font-size:11.5px;margin:0}
.g-list{margin:0;padding-left:18px;display:grid;gap:7px}
.g-list li{line-height:1.6}
.g-list b{display:block;font-size:12px}
.g-list li span{color:var(--ink-2);font-size:12px}
.seqd,.reld{width:100%;height:auto;display:block;margin-top:4px}
.sd-actor{font-family:var(--mono);font-size:10px;fill:var(--ink-2)}
.sd-life{stroke:var(--line);stroke-width:1}
.sd-lbl{font-family:var(--sans);font-size:9.5px;fill:var(--ink-3)}
.sd-arrow{stroke:var(--run);stroke-width:1.6;stroke-dasharray:280;stroke-dashoffset:280;animation:sd-draw .5s ease forwards;animation-delay:var(--d)}
@keyframes sd-draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.sd-arrow{animation:none;stroke-dashoffset:0}}
.sd-arrowhead{fill:var(--run)}
.rel-box{fill:var(--surface-2);stroke:var(--line)}
.rel-name{font-family:var(--mono);font-size:11px;fill:var(--ink);font-weight:600}
.rel-field{font-family:var(--mono);font-size:9px;fill:var(--ink-3)}
.rel-line{stroke:var(--ink-3);stroke-width:1.2}
.rel-card{font-size:9.5px;fill:var(--ink-3)}
.g-start{width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:7px 10px;font-weight:700;text-align:center}
.g-start:hover{filter:brightness(1.05)}

/* ステップ表示 */
.stepmode{display:grid;gap:14px;min-width:0}
.step-bar{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--surface);padding-block:8px;border-bottom:1px solid var(--line)}
.step-pills{display:flex;gap:4px;flex-wrap:wrap}
.step-pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:28px;height:26px;padding:0 9px;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.step-pill.done{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.step-pill[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.stepcard{border:1px solid var(--accent);border-radius:9px;background:var(--accent-soft);padding:14px 16px;display:grid;gap:8px;animation:g-in .3s ease both}
@media (prefers-reduced-motion:reduce){.stepcard{animation:none}}
.stepcard .eyebrow{font-size:11px;letter-spacing:.04em;color:var(--accent-ink);font-family:var(--mono)}
.stepcard h2{margin:0;font-size:16px;text-wrap:balance}
.stepcard p{margin:0;line-height:1.8;max-width:72ch}
.stepcard .dg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:520px}
.stepcard .files{display:flex;gap:6px;flex-wrap:wrap}
.step-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step-done{border:1px dashed var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:6px}
.filelist{border:1px solid var(--line);border-radius:9px;overflow:hidden;position:sticky;top:0}
.filelist header{padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-2)}
.fl{width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 10px;display:block;text-align:left}
.fl:first-of-type{border-top:0}
.fl:hover{background:var(--surface-2)}
.fl[aria-current="true"]{background:var(--accent-soft)}
.fl .nm{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere;display:block}
.fl .st{font-size:10.5px;color:var(--ink-3);display:flex;gap:6px;font-variant-numeric:tabular-nums;margin-top:1px}
.add{color:var(--ok)} .del{color:var(--danger)}
.diffs{display:grid;gap:12px;min-width:0}
.file{border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0}
.file > header{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.file > header .nm{font-family:var(--mono);font-size:12px;font-weight:500;overflow-wrap:anywhere}
.code{overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6}
.hunk{background:var(--accent-soft);color:var(--ink-2);padding:2px 10px;font-size:11px}
.ln{display:grid;grid-template-columns:42px 42px 20px max-content;min-width:100%}
.ln .o,.ln .n{color:var(--ink-3);text-align:right;padding-right:8px;user-select:none;font-size:11px}
.ln .c{white-space:pre;padding-right:16px}
.ln .cm{border:0;background:transparent;color:var(--accent);opacity:0;font-weight:700;padding:0;width:20px}
.ln:hover .cm,.ln .cm:focus-visible{opacity:1}
.ln.a{background:var(--add-bg)} .ln.a .o,.ln.a .n{background:var(--add-gutter)}
.ln.d{background:var(--del-bg)} .ln.d .o,.ln.d .n{background:var(--del-gutter)}
.tk-kw{color:var(--kw)} .tk-str{color:var(--str)} .tk-com{color:var(--com);font-style:italic} .tk-num{color:var(--num)}
.lc{margin:4px 10px 6px 104px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:grid;gap:6px;font-family:var(--sans);font-size:12.5px;max-width:640px}
.lc .who{font-size:11px;color:var(--ink-3)}textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;resize:vertical;min-height:54px}
input[type=text],select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px}

function guidePanel(t) {

  return `<aside class="guide" aria-label="Review Guide">
    <div class="guide-head"><b>Review Guide</b></div>

      <table class="g-table"><thead><tr><th>ファイル</th><th>変更</th></tr></thead>

      ${missing.length ? `<p class="g-warn">⚠ diff に含まれるがガイドが触れていないファイルが${missing.length}件: ${missing.map((f) => `<span class="mono">${esc(f.path)}</span>`).join("、")}</p>` : `<p class="g-ok">✓ diff の全ファイルがガイドに触れています</p>`}
    </section>

      <ul class="g-list">${g.risks.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
    </section>
    <section class="g-sec" style="--gi:6"><h3>Tests</h3>

      <tbody>${g.tests.map((x) => `<tr><td>${esc(x.behavior)}</td><td class="mono">${esc(x.test)}</td></tr>`).join("")}</tbody></table>
    </section>
  </aside>`;
}

function currentStep(t) {
  if (!t.guide) return null;
  return S.step[t.id] === undefined ? 0 : S.step[t.id];
}
function unguidedFiles(t) {
  const mentioned = new Set(t.guide.readingOrder.flatMap((r) => r.paths));
  return t.diff.filter((f) => !mentioned.has(f.path));
}
function stepView(t, idx) {
  const g = t.guide;
  const steps = g.readingOrder;
  const step = steps[idx];
  const files = step.paths.map((p) => t.diff.find((f) => f.path === p)).filter(Boolean);
  const last = idx === steps.length - 1;
  const missing = unguidedFiles(t);
  const diagram = step.diagram === "sequence" ? sequenceSvg(g.sequence) : step.diagram === "relation" ? relationSvg() : "";
  return `<div class="stepmode">
    <div class="step-bar">
      <b>ガイドに沿って読む</b>
      <span class="step-pills" role="group" aria-label="読むステップ">${steps.map((s, i) => `<button class="step-pill ${i < idx ? "done" : ""}" data-act="step-goto" data-idx="${i}" title="${esc(s.title)}" ${i === idx ? 'aria-current="step"' : ""}>${i + 1}</button>`).join("")}</span>
      <span class="spacer"></span>
      <button class="btn sm" data-act="step-exit">全体表示に戻る</button>
    </div>
    <section class="stepcard" aria-live="polite">
      <span class="eyebrow">STEP ${idx + 1} / ${steps.length}</span>
      <h2>${esc(step.title)}</h2>
      <p>${esc(step.explain)}</p>
      ${diagram ? `<div class="dg">${diagram}</div>` : ""}    </section>
    <div class="diffs">${files.map((f) => fileBlock(t, f)).join("")}</div>
    ${last ? `<section class="step-done"><b>ガイドのステップはここまでです</b>
      ${missing.length ? `<p class="g-warn">⚠ diff に含まれるがガイドが触れていないファイルが${missing.length}件あります。判断の前に目を通してください。</p><div class="diffs">${missing.map((f) => fileBlock(t, f)).join("")}</div>` : `<p class="g-ok">✓ diff の全ファイルをガイドのステップで読みました</p>`}
      <p class="hint">説明がコードと一致していたかを振り返ってから、下で承認か差し戻しを決めてください。</p></section>` : ""}
    <div class="step-foot">
      <button class="btn" data-act="step-goto" data-idx="${idx - 1}" ${idx === 0 ? "disabled" : ""}>← 前のステップ</button>
      ${last ? "" : `<button class="btn" data-act="step-goto" data-idx="${idx + 1}" style="border-color:var(--accent)">次のステップ: ${esc(steps[idx + 1].title)} →</button>`}
      <span class="hint"><kbd class="mono">[</kbd> <kbd class="mono">]</kbd> でも移動できます</span>
    </div>
  </div>`;
}

// ================================================================ 中央: レビュー画面
function openButtons(t) {
  return `<button class="btn sm" data-act="toast" data-msg="エディタ／ターミナルで開くボタンは第2段階です">エディタで開く</button>`;
}
function contextBox(t) {
  const parts = [];

    parts.push(`<details class="ctx"><summary>これまでのレビュー（${t.reviews.length}件、差し戻し）</summary>
      <div style="display:grid;gap:8px">${t.reviews.map((r) => `<div><span class="hint">${clock(r.at)} · ${ago(r.at)}</span><pre class="block" style="margin-top:4px">${esc(r.comment)}</pre></div>`).join("")}</div>
    </details>`);
  }
  if (t.lastCommand) {

    parts.push(`<details class="ctx"><summary>直近の command ステップの結果（<span class="mono">${esc(c.step)}</span> · exit ${c.exitCode}）</summary>

}
function reviewView(t) {

    <div class="crumbs"><span class="pjdot" style="background:${p.color}"></span><span>${esc(p.id)}</span><span class="mono">${esc(t.wf)}</span><span class="mono">${t.id}</span><span class="mono">P${t.prio}</span></div>

      <span class="hint">${ago(t.since)}から待っています</span>

    ${declared.map((path) => `<section class="rv-files-md">

      <div class="md">${md(t.reviewFiles?.[path] ?? "(ファイルがありません)")}</div>
    </section>`).join("")}

    <div class="headrow">
      <b>変更</b>
      <span class="hint">${all.length} ファイル · ベースブランチとの merge-base から worktree の現在まで（未コミットを含む）</span>
      <span class="spacer"></span>
      ${hasSince ? `<span class="seg" role="group" aria-label="差分の範囲"><button data-act="scope" data-s="all" aria-pressed="${scope === "all"}">全体</button><button data-act="scope" data-s="since" aria-pressed="${scope === "since"}">前回レビュー以降</button></span>` : ""}
    </div>

    ${all.length === 0 ? `<div class="empty-diff">コードの変更はまだありません。上の計画を読んで判断してください。</div>` : currentStep(t) !== null ? stepView(t, currentStep(t)) : `
    <div class="rv-body ${t.guide ? "has-guide" : ""}">
      <nav class="filelist" aria-label="変更ファイル">
        <header>${all.length} ファイル</header>
        ${files.map((f) => { const { a, d } = stats(f); return `<button class="fl" data-act="file" data-path="${esc(f.path)}">
          <span class="nm">${esc(f.path)}</span>
          <span class="st"><span class="add">+${a}</span><span class="del">−${d}</span></span>
        </button>`; }).join("")}
        ${scope === "since" && all.length > files.length ? `<div class="hint" style="padding:6px 10px">前回から変わっていない ${all.length - files.length} ファイルを隠しています</div>` : ""}
      </nav>
      <div class="diffs">${files.map((f) => fileBlock(t, f)).join("")}</div>
      ${guidePanel(t)}
    </div>`}
  </div>
  <footer class="decide">
    <div>
      <div class="meta"><span>行コメント <b>${ncom}</b> 件</span></div>
      <textarea id="overall" placeholder="全体へのコメント（差し戻すときに行コメントと一緒に送ります）">${esc(S.overall[t.id] ?? "")}</textarea>
    </div>
    <div class="actions">
      <button class="btn danger" id="reject-btn" data-act="reject" ${canReject ? "" : "disabled"}>差し戻す…</button>
      <button class="btn primary" data-act="approve">承認する</button>
    </div>
  </footer>`;
}

// ================================================================ 中央: タスク画面
function taskView(t) {
  const p = proj(t.project);
  const steps = WORKFLOWS[t.wf];
  const idx = steps.findIndex((x) => x.id === t.step);
  const stateTxt = { running: ["実行中", "p-run"], queued: ["待ち", "p-muted"], paused: ["一時停止", "p-muted"], failed: ["失敗", "p-danger"], completed: ["完了", "p-ok"], canceled: ["中止", "p-muted"] }[t.state];
  const queuePos = TASKS.filter((x) => x.state === "queued").sort((a, b) => a.prio - b.prio || a.since - b.since).findIndex((x) => x.id === t.id) + 1;
  return `<div class="pad">
    <div class="crumbs"><span class="pjdot" style="background:${p.color}"></span><span>${esc(p.id)}</span><span class="mono">${esc(t.wf)}</span><span class="mono">${t.id}</span><span class="mono">P${t.prio}</span></div>
    <h1>${esc(t.title)}</h1>
    <div class="headrow">
      <span class="pill ${stateTxt[1]}">${stateTxt[0]}</span>
      ${t.step ? `<span>ステップ <span class="mono">${esc(t.step)}</span> <span class="hint">（${idx + 1} / ${steps.length}${t.attempt > 1 ? ` · ${t.attempt}回目` : ""}）</span></span>` : ""}
      <span class="hint">${t.state === "running" ? `${elapsed(t.since)} 経過` : ago(t.since)}</span>
    </div>

    ${t.state === "failed" ? `<section class="box danger"><h2><span class="mono">${esc(t.step)}</span> で失敗しました（${t.attempt}回目。onFailure の maxAttempts に達しました）</h2><p>worktree は証拠として残しています。中を確認してから、<span class="mono">dctl add</span> で同じ内容を投入し直すか、<span class="mono">dctl gc ${esc(t.id)}</span> で片付けてください（UIでの「同じ内容で投入し直す」は第2段階です）。</p></section>` : ""}
    ${t.refused ? `<section class="box danger"><h2>worktree の削除を拒否しました</h2><p>完了時に未コミットの変更が残っていました。ワークフローの最終ステップがコミットしていない可能性があります。中を確認してから <span class="mono">dctl gc ${esc(t.id)}</span> で削除してください。</p></section>` : ""}
    ${t.degraded ? `<section class="box deg"><h2><span class="mono">${esc(t.degraded)}</span> が、権限で拒否された操作を含んだまま成功扱いで終わりました</h2><p>後続のステップは進んでいますが、エージェントが意図した操作（ここではコミット）はされていません。</p></section>` : ""}
    ${t.state === "queued" ? `<section class="box quiet"><p>実行枠が空くのを待っています（行列の ${queuePos} 番目）。枠が取れた時点で worktree が作られます。</p></section>` : ""}
    ${t.state === "paused" ? `<section class="box quiet"><p><span class="mono">dctl resume ${esc(t.id)}</span> で再開できます（UIからの一時停止・再開は第2段階です）。</p></section>` : ""}

    <div class="actions">
      ${!isTerminal(t.state) ? '<button class="btn danger" data-act="cancel">中止</button>' : ""}
      ${t.worktree ? `${openButtons(t)}<button class="btn sm" data-act="toast" data-msg="パスをコピーしました">パスをコピー</button>` : ""}
    </div>
    ${t.worktree ? `<p class="mono hint">${esc(t.worktree)}</p>` : ""}

    ${t.log ? `<div class="headrow"><b>ログ</b><span class="mono hint">${esc(t.step ?? "")}${t.attempt > 1 ? " #" + t.attempt : ""}</span><span class="spacer"></span><span class="hint">${t.state === "running" ? '<span class="spin" style="display:inline-block;vertical-align:-2px"></span> 追従中' : "末尾 200 行"}</span></div>
    <pre class="block" id="log">${esc(t.log)}</pre>` : ""}

    ${t.step ? `<details class="runs"><summary>実行履歴</summary><div class="runtable"><table>
      <thead><tr><th>ステップ</th><th>種類</th><th>試行</th><th>状態</th></tr></thead>
      <tbody>${steps.slice(0, idx + 1).map((s, i) => `<tr><td class="mono">${esc(s.id)}</td><td class="hint">${s.type}</td><td class="mono">#${i === idx ? t.attempt : 1}</td><td>${i < idx ? '<span class="pill p-ok">成功</span>' : `<span class="pill ${stateTxt[1]}">${stateTxt[0]}</span>`}${t.degraded === s.id ? ' <span class="pill p-deg">degraded</span>' : ""}</td></tr>`).join("")}</tbody>
    </table></div></details>` : ""}
  </div>`;
}

// ================================================================ モーダル
function modal() {
  if (!S.modal) return "";
  const t = TASKS.find((x) => x.id === S.sel);
  let body = "";
  if (S.modal === "reject-preview") {
    const def = stepDef(t);
    body = `<h2>差し戻してエージェントに送る内容</h2>
      <p class="hint">行コメントと全体へのコメントを1つの文字列にまとめて <span class="mono">task.reject(comment)</span> で送ります。<span class="mono">${esc(def.onReject)}</span> ステップに戻ります。</p>
      <pre class="block">${esc(composeRejection(t))}</pre>
      <div class="actions"><button class="btn danger" data-act="reject-do">差し戻す</button><button class="btn" data-act="modal-close">戻る</button></div>`;
  }
  return `<div class="scrim" data-act="modal-close"></div><div class="modal" role="dialog">${body}</div>`;

// ================================================================ 描画
function banner() {
  if (!S.bannerOpen) return "";
  return `<div class="banner"><strong>PROTOTYPE</strong>
    <p>doctrine ② レビューアプリの第1段階（MVP）を確かめるための、UIのみ・ダミーデータのプロトタイプです。デーモンにはつながっていません。気になる点はこのページへのコメントで教えてください。</p>
    <button data-act="banner-close" aria-label="閉じる">×</button></div>`;
}
function render() {
  const t = TASKS.find((x) => x.id === S.sel);
  let main;
  if (!t) main = `<div class="pad"><p class="hint">左からタスクを選んでください</p></div>`;
  else if (t.state === "suspended") main = reviewView(t);
  else main = taskView(t);
  const scrollTop = document.querySelector(".main")?.scrollTop ?? 0;
  document.getElementById("root").innerHTML = `${banner()}<div class="app">${rail()}${sidebar()}<main class="main">${main}</main></div>${modal()}
    <div class="protobar" aria-label="プロトタイプ操作（評価対象外）"><span class="tag">PROTOTYPE</span>
      <span><kbd>j</kbd><kbd>k</kbd> タスク移動 <kbd>n</kbd><kbd>p</kbd> ファイル移動</span>
      ${S.bannerOpen ? "" : '<button data-act="banner-open">プロトタイプについて</button>'}
    </div>
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
  const m = document.querySelector(".main");
  if (m && render.keepScroll) m.scrollTop = scrollTop;
  render.keepScroll = false;
  const lc = document.getElementById("lc-text");
  if (lc && S.editing?.focus) { lc.focus(); S.editing.focus = false; }
}

// ================================================================ 操作
function toast(msg) { S.toast = msg; render.keepScroll = true; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render.keepScroll = true; render(); }, 2600); }
function goStep(t, idx) {
  const n = t.guide.readingOrder.length;
  if (idx < 0 || idx >= n) return;
  S.step[t.id] = idx; S.editing = null;
  render();
  document.querySelector(".stepmode")?.scrollIntoView({ block: "start" });
}
function selectNextReview(except) {
  const next = sidebarOrder().find((x) => groupOf(x) === "review" && x.id !== except);
  if (next) S.sel = next.id;
}

document.addEventListener("change", (e) => {
  if (e.target.id === "proj-filter") { S.project = e.target.value; render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "overall") {
    S.overall[S.sel] = e.target.value;
    persistDraft(S.sel);
    const t = TASKS.find((x) => x.id === S.sel);
    document.getElementById("reject-btn").disabled = !(commentsOf(t).length || e.target.value.trim());
  }
  if (e.target.id === "lc-text" && S.editing) S.editing.text = e.target.value;
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const t = TASKS.find((x) => x.id === S.sel);
  const act = el.dataset.act;
  switch (act) {
    case "view": S.view = el.dataset.v; if (S.view === "done") { const f = sidebarOrder()[0]; if (f) S.sel = f.id; } else if (S.view === "tasks" && groupOf(t) === "done") { const f = sidebarOrder()[0]; if (f) S.sel = f.id; } break;
    case "sel": S.sel = el.dataset.id; S.editing = null; break;
    case "toast": return toast(el.dataset.msg);
    case "banner-close": S.bannerOpen = false; saveFlag("doctrine-proto-banner-dismissed", true); break;
    case "banner-open": S.bannerOpen = true; saveFlag("doctrine-proto-banner-dismissed", false); break;
    case "modal-close": S.modal = null; break;
    case "scope": S.scope[t.id] = el.dataset.s; break;
    case "step-goto": goStep(t, Number(el.dataset.idx)); return;
    case "step-exit": S.step[t.id] = null; break;
    case "file": document.getElementById("file-" + el.dataset.path)?.scrollIntoView({ block: "start", behavior: "smooth" }); return;
    case "lc-new": S.editing = { task: t.id, path: el.dataset.path, line: Number(el.dataset.line), quote: el.dataset.quote, text: "", focus: true }; render.keepScroll = true; break;
    case "lc-cancel": S.editing = null; render.keepScroll = true; break;
    case "lc-save": {
      const ed = S.editing;
      if (ed.text.trim()) { commentsOf(t).push({ path: ed.path, line: ed.line, quote: ed.quote, text: ed.text.trim() }); persistDraft(t.id); }
      S.editing = null; render.keepScroll = true; break;
    }
    case "lc-del": commentsOf(t).splice(Number(el.dataset.i), 1); persistDraft(t.id); render.keepScroll = true; break;
    case "approve": {
      const steps = WORKFLOWS[t.wf], i = steps.findIndex((x) => x.id === t.step);
      clearDraft(t.id);
      if (i === steps.length - 1) { t.state = "completed"; t.worktree = null; }
      else { t.state = "running"; t.step = steps[i + 1].id; t.attempt = 1; t.log = `$ ${steps[i + 1].id}\n…`; }
      t.since = NOW; selectNextReview(t.id);
      return toast(`承認しました: ${t.title}`);
    }
    case "reject": S.modal = "reject-preview"; render.keepScroll = true; break;
    case "reject-do": {
      const def = stepDef(t);
      t.reviews.push({ at: NOW, comment: composeRejection(t) });
      clearDraft(t.id);
      t.state = "running"; t.step = def.onReject; t.attempt += 1; t.since = NOW; t.log = "assistant: レビューの指摘を読みます\n…";
      S.modal = null; selectNextReview(t.id);
      return toast(`差し戻しました: ${t.title}`);
    }
    case "cancel": t.state = "canceled"; t.since = NOW; t.dirty = true; return toast("中止しました。worktree は残します");
  }
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea,select,[contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && S.modal) { S.modal = null; render(); return; }
  const t = TASKS.find((x) => x.id === S.sel);
  if (e.key === "j" || e.key === "k") {
    const order = sidebarOrder(); const i = order.findIndex((x) => x.id === S.sel);
    const n = order[Math.max(0, Math.min(order.length - 1, i + (e.key === "j" ? 1 : -1)))];
    if (n) { S.sel = n.id; S.editing = null; render(); }
    return;
  }
  if (!t || t.state !== "suspended" || !t.diff.length) return;
  if ((e.key === "[" || e.key === "]") && currentStep(t) !== null) {
    goStep(t, currentStep(t) + (e.key === "]" ? 1 : -1));
    return;
  }
  if (e.key === "n" || e.key === "p") {
    const files = filesFor(t);
    const cur = S.file[t.id] ?? files[0].path;
    const i = Math.max(0, files.findIndex((f) => f.path === cur));
    const f = files[(i + (e.key === "n" ? 1 : files.length - 1)) % files.length];
    S.file[t.id] = f.path;
    document.getElementById("file-" + f.path)?.scrollIntoView({ block: "start", behavior: "smooth" });
  }
});
setInterval(() => {
  const t = TASKS.find((x) => x.id === S.sel);
  const pre = document.getElementById("log");
  if (!t || t.state !== "running" || !pre) return;
  t.logIdx = (t.logIdx ?? 0) + 1;
  t.log += "\n" + FOLLOW_POOL[t.logIdx % FOLLOW_POOL.length];
  pre.textContent = t.log;
  pre.scrollTop = pre.scrollHeight;
}, 1800);
render();
</script>

    --degraded:#C7A0FF; --degraded-bg:#2A1F3D;

  --ink:#E6E9ED; --ink-2:#A2AAB4; --ink-3:#6E7681; --line:#2B3037;
  --accent:#86A2FF; --accent-ink:#0E1426; --accent-soft:#232D4A;
  --attn:#EFB14A; --attn-bg:#33270F; --attn-line:#7F5B1D;
  --danger:#FF8A7D; --danger-bg:#3A1B18;
  --degraded:#C7A0FF; --degraded-bg:#2A1F3D;

  --add-bg:#15291D; --add-gutter:#1C3826; --del-bg:#301A18; --del-gutter:#42221F;

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;padding-inline:16px;padding-block:12px 76px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px}
.hint{color:var(--ink-3);font-size:11.5px}

.app{max-width:1600px;margin-inline:auto;display:grid;grid-template-columns:52px 292px minmax(0,1fr);height:calc(100vh - 100px);min-height:560px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.rail{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px}
.rail .grow{flex:1}
.ib{position:relative;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.ib:hover{background:var(--surface-2)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib .pip{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--attn);border:2px solid var(--side)}
@media (max-width:900px){.rail{flex-direction:row;justify-content:flex-start;padding-inline:8px;border-right:0;border-bottom:1px solid var(--line)}.rail .grow{display:none}}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;border-bottom:1px solid var(--line)}
.side-head select{border:0;background:transparent;font-weight:700;font-size:14px;padding:2px 0;max-width:170px}
.side-head .count{color:var(--ink-3);font-variant-numeric:tabular-nums}
.side-head .grow{flex:1}
.plus{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1}
.plus:hover{border-color:var(--ink-3)}
.side-scroll{overflow-y:auto;flex:1;padding:6px 6px 10px}
@media (max-width:900px){.side{border-right:0;border-bottom:1px solid var(--line)}.side-scroll{max-height:320px}}
.grp{margin-top:8px}
.grp h3{margin:0;padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center;letter-spacing:.02em}
.grp h3 .count{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.it{width:100%;border:0;background:transparent;border-radius:8px;padding:6px 8px 6px 6px;display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 6px;text-align:left}
.it:hover{background:var(--surface-2)}
.it[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.it .ico{grid-row:span 2;display:grid;place-items:center;height:20px}
.it .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.it .m{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:11.5px;min-width:0}
.it .m .pj{display:inline-flex;align-items:center;gap:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .m .tm{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.pjdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.diamond{width:9px;height:9px;background:var(--attn);transform:rotate(45deg);border-radius:1.5px}
.bang{width:12px;height:12px;border-radius:50%;background:var(--danger);color:var(--surface);font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1}
.bang.deg{background:var(--degraded)}
.spin{width:12px;height:12px;border-radius:50%;border:2px dotted var(--accent);animation:spin 2.4s linear infinite}
.ring{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-3)}
.pause{width:10px;height:10px;border-left:3px solid var(--ink-2);border-right:3px solid var(--ink-2)}
.check{width:12px;height:12px;border-radius:50%;background:var(--ok);position:relative}
.xmark{width:12px;height:12px;border-radius:50%;background:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.side-foot{border-top:1px solid var(--line);padding:7px 12px;color:var(--ink-3);font-size:11px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.side-foot b{color:var(--ink-2);font-weight:500;font-family:var(--mono)}

/* main */
.main{overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.pad{padding:18px 22px;display:grid;gap:14px;align-content:start}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:11.5px}
h1{margin:0;font-size:19px;line-height:1.35;text-wrap:balance}
.headrow{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;font-weight:700;padding:0 7px;border-radius:4px;line-height:19px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.p-attn{background:var(--attn-bg);color:var(--attn)}
.p-danger{background:var(--danger-bg);color:var(--danger)}
.p-deg{background:var(--degraded-bg);color:var(--degraded)}
.p-run{background:var(--accent-soft);color:var(--accent)}
.p-muted{background:var(--surface-2);color:var(--ink-2)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 12px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.box{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:8px}
.box h2{margin:0;font-size:13px}
.box p{margin:0}
.box.attn{background:var(--attn-bg);border-color:var(--attn-line)}
.box.danger{background:var(--danger-bg);border-color:var(--danger)}
.box.deg{background:var(--degraded-bg);border-color:var(--degraded)}
.box.quiet{background:var(--surface-2);border-color:var(--surface-2)}
pre.block{margin:0;background:var(--sunken);border-radius:7px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre;max-height:320px;overflow-y:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.runs summary{cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:700}
.runtable{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--ink-3);font-size:11px;font-weight:500;border-top:0;background:var(--surface-2)}
tr.stale td{background:var(--attn-bg)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}

/* review */
.rv-files-md{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.rv-files-md header{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.md{padding:6px 18px 14px;max-width:72ch;line-height:1.75}
.md h1{font-size:16px;margin:10px 0 4px}
.md h2{font-size:13.5px;margin:14px 0 2px}
.md ul,.md ol{margin:4px 0;padding-left:22px}
.md p{margin:4px 0}
.md code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.rv-body{display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1150px){.rv-body{grid-template-columns:1fr}}
.filelist{border:1px solid var(--line);border-radius:9px;overflow:hidden;position:sticky;top:0}
.filelist header{padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.fl{width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 10px;display:grid;grid-template-columns:16px minmax(0,1fr);gap:1px 6px;text-align:left}
.fl:first-of-type{border-top:0}
.fl:hover{background:var(--surface-2)}
.fl[aria-current="true"]{background:var(--accent-soft)}
.fl .v{grid-row:span 2;align-self:center;width:13px;height:13px;border-radius:3px;border:1.5px solid var(--ink-3)}
.fl .v.on{background:var(--ok);border-color:var(--ok)}
.fl .nm{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}

.add{color:var(--ok)} .del{color:var(--danger)}
.changed{color:var(--attn);font-weight:700}
.diffs{display:grid;gap:12px;min-width:0}
.file{border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0}

.decide{position:sticky;bottom:0;margin-top:auto;background:var(--surface);border-top:1px solid var(--line);padding:10px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;box-shadow:0 -8px 20px rgba(0,0,0,.05)}
@media (max-width:700px){.decide{grid-template-columns:1fr}}
.decide .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:12px;margin-bottom:6px}
.decide textarea{min-height:40px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.4);z-index:30}

.field-l{display:grid;gap:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.warnlist{margin:0;padding-left:18px;display:grid;gap:6px}

</style>

const stats = (f) => {
  let a = 0, d = 0;
  for (const h of f.hunks) for (const l of h.body.split("\n")) { if (l[0] === "+") a++; else if (l[0] === "-") d++; }
  return { a, d };
};
const vkey = (t, f, hash = f.hash) => `${t.id}|${f.path}|${hash}`;
const isViewed = (t, f) => S.viewed.has(vkey(t, f));
const changedSinceViewed = (t, f) => !isViewed(t, f) && f.prevHash && f.prevHash !== f.hash && S.viewed.has(vkey(t, f, f.prevHash));
const commentsOf = (t) => (S.comments[t.id] ??= []);

function fileBlock(t, f) {
  const viewed = isViewed(t, f);
  const { a, d } = stats(f);
  let rows = "";
  for (const h of f.hunks) {
    rows += `<div class="hunk">@@ -${h.old} +${h.new} @@</div>`;
    let o = h.old, n = h.new;
    for (const raw of h.body.split("\n")) {
      const kind = raw[0] === "+" ? "a" : raw[0] === "-" ? "d" : "";
      const text = raw.slice(1);
      const on = kind === "a" ? "" : o, nn = kind === "d" ? "" : n;
      const line = kind === "d" ? o : n;
      rows += `<div class="ln ${kind}"><span class="o">${on}</span><span class="n">${nn}</span><button class="cm" data-act="lc-new" data-path="${esc(f.path)}" data-line="${line}" data-quote="${esc(text.trim())}" aria-label="${line}行目にコメント">+</button><span class="c">${highlight(text)}</span></div>`;
      rows += lineComments(t, f.path, line);
      if (kind !== "a") o++;
      if (kind !== "d") n++;
    }
  }
  return `<section class="file" id="file-${esc(f.path)}">
    <header><span class="nm">${esc(f.path)}</span><span class="add mono">+${a}</span><span class="del mono">−${d}</span>
      ${changedSinceViewed(t, f) ? '<span class="changed">前回見た後に変更</span>' : ""}
      <span class="spacer"></span>
      <button class="viewed ${viewed ? "on" : ""}" data-act="viewed" data-path="${esc(f.path)}">${viewed ? "✓ 見た" : "見た"}</button>
    </header>
    <div class="code">${rows}</div>
  </section>`;
}
function lineComments(t, path, line) {
  let html = "";
  commentsOf(t).forEach((c, i) => {
    if (c.path !== path || c.line !== line) return;
    html += `<div class="lc"><span class="who">あなた · 送信前の下書き</span><div>${esc(c.text)}</div><div class="actions"><button class="btn sm" data-act="lc-del" data-i="${i}">削除</button></div></div>`;
  });
  const e = S.editing;
  if (e && e.task === t.id && e.path === path && e.line === line) {
    html += `<div class="lc"><span class="who">${esc(path)}:${line} にコメント</span>
      <textarea id="lc-text" placeholder="エージェントへの指摘">${esc(e.text)}</textarea>
      <div class="actions"><button class="btn sm primary" data-act="lc-save">下書きに追加</button><button class="btn sm" data-act="lc-cancel">やめる</button></div></div>`;
  }
  return html;
}
function composeRejection(t) {
  const parts = commentsOf(t).map((c) => `${c.path}:${c.line}\n  > ${c.quote}\n  ${c.text}`);
  const overall = (S.overall[t.id] ?? "").trim();
  if (overall) parts.push(`全体: ${overall}`);
  return parts.join("\n\n");
}

function md(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of src.split("\n")) {
    let m;
    if ((m = line.match(/^(#{1,2}) (.*)/))) { close(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = line.match(/^- (.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\d+\. (.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if (line.trim()) { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}

// ================================================================ 中央: レビュー画面
function openButtons(t) {
  return `<button class="btn sm" data-act="toast" data-msg="code ${esc(t.worktree)} を起動しました">エディタで開く</button>
    <button class="btn sm" data-act="toast" data-msg="konsole --workdir ${esc(t.worktree)} を起動しました">ターミナルで開く</button>`;
}
function reviewView(t) {
  const def = stepDef(t);
  const p = proj(t.project);
  const files = filesFor(t);
  const all = t.diff;
  const hasSince = t.reviews.length > 0 && all.some((f) => f.since);
  const scope = S.scope[t.id] ?? "all";
  const cur = S.file[t.id] ?? files[0]?.path;
  const shown = S.diffLayout === "single" ? files.filter((f) => f.path === cur) : files;
  const unviewed = all.filter((f) => !isViewed(t, f));
  const last = t.reviews[t.reviews.length - 1];
  const declared = def.review?.files ?? [];
  const ncom = commentsOf(t).length;
  const canReject = ncom > 0 || (S.overall[t.id] ?? "").trim().length > 0;

  return `<div class="pad">
    <div class="crumbs"><span class="pjdot" style="background:${p.color}"></span><span>${esc(p.id)}</span><span class="mono">${esc(t.wf)}</span><span class="mono">${t.id}</span><span class="mono">P${t.prio}</span></div>
    <h1>${esc(t.title)}</h1>
    <div class="headrow">
      <span class="pill p-attn">◆ ${esc(def.title)}</span>
      ${t.reviews.length ? `<span class="pill p-muted">${t.reviews.length + 1}回目のレビュー</span>` : ""}
      <span class="hint">${ago(t.since)}から待っています</span>
      <span class="mono hint">${esc(t.branch)}</span>
      <span class="spacer"></span>
      ${openButtons(t)}
    </div>

    ${last ? `<details class="box quiet"><summary style="cursor:pointer"><b>前回の差し戻し</b> <span class="hint">${ago(last.at)}</span></summary><pre class="block" style="margin-top:8px">${esc(last.text)}</pre></details>` : ""}

    ${declared.map((path) => `<section class="rv-files-md">
      <header><span class="mono">${esc(path)}</span><span class="hint">このステップが見せるファイル（review.files）</span></header>
      <div class="md">${md(t.reviewFiles?.[path] ?? "(ファイルがありません)")}</div>
    </section>`).join("")}

    <div class="headrow">
      <b>変更</b>
      <span class="hint">${all.length} ファイル · ベースブランチとの merge-base から worktree の現在まで（未コミットを含む）</span>
      <span class="spacer"></span>
      ${hasSince ? `<span class="seg" role="group" aria-label="差分の範囲"><button data-act="scope" data-s="all" aria-pressed="${scope === "all"}">全体</button><button data-act="scope" data-s="since" aria-pressed="${scope === "since"}">前回レビュー以降</button></span>` : ""}
    </div>

    ${all.length === 0 ? `<div class="empty-diff">コードの変更はまだありません。上の計画を読んで判断してください。</div>` : `
    <div class="rv-body">
      <nav class="filelist" aria-label="変更ファイル">
        <header><span>見た ${all.length - unviewed.length} / ${all.length}</span><span class="mono">n / p · v</span></header>
        ${files.map((f) => { const { a, d } = stats(f); return `<button class="fl" data-act="file" data-path="${esc(f.path)}" aria-current="${cur === f.path}">
          <span class="v ${isViewed(t, f) ? "on" : ""}"></span>
          <span class="nm">${esc(f.path)}</span>
          <span class="st"><span class="add">+${a}</span><span class="del">−${d}</span>${changedSinceViewed(t, f) ? '<span class="changed">変更あり</span>' : ""}</span>
        </button>`; }).join("")}
        ${scope === "since" && all.length > files.length ? `<div class="hint" style="padding:6px 10px">前回から変わっていない ${all.length - files.length} ファイルを隠しています</div>` : ""}
      </nav>
      <div class="diffs">${shown.map((f) => fileBlock(t, f)).join("")}</div>
    </div>`}
  </div>
  <footer class="decide">
    <div>
      <div class="meta"><span>行コメント <b>${ncom}</b> 件</span><span>未確認のファイル <b>${unviewed.length}</b> 件</span><span class="hint">判断にキーは割り当てていません</span></div>
      <textarea id="overall" placeholder="全体へのコメント（差し戻すときに行コメントと一緒に送ります）">${esc(S.overall[t.id] ?? "")}</textarea>
    </div>
    <div class="actions">
      <button class="btn danger" id="reject-btn" data-act="reject" ${canReject ? "" : "disabled"}>差し戻す…</button>
      <button class="btn primary" data-act="approve">承認する</button>
    </div>
  </footer>`;
}

// ================================================================ 中央: タスク画面
function taskView(t) {
  const p = proj(t.project);
  const g = groupOf(t);
  const steps = WORKFLOWS[t.wf];
  const idx = steps.findIndex((x) => x.id === t.step);
  const stateTxt = { running: ["実行中", "p-run"], queued: ["待ち", "p-muted"], paused: ["一時停止", "p-muted"], failed: ["失敗", "p-danger"], completed: ["完了", "p-ok"], canceled: ["中止", "p-muted"] }[t.state];
  const queuePos = TASKS.filter((x) => x.state === "queued").sort((a, b) => a.prio - b.prio || a.since - b.since).findIndex((x) => x.id === t.id) + 1;
  const retry = t.state === "failed" || t.state === "canceled";
  const def = stepDef(t);
  return `<div class="pad">
    <div class="crumbs"><span class="pjdot" style="background:${p.color}"></span><span>${esc(p.id)}</span><span class="mono">${esc(t.wf)}</span><span class="mono">${t.id}</span><span class="mono">P${t.prio}</span></div>
    <h1>${esc(t.title)}</h1>
    <div class="headrow">
      <span class="pill ${stateTxt[1]}">${stateTxt[0]}</span>
      ${t.step ? `<span>ステップ <span class="mono">${esc(t.step)}</span> <span class="hint">（${idx + 1} / ${steps.length}${t.attempt > 1 ? ` · ${t.attempt}回目` : ""}）</span></span>` : ""}
      <span class="hint">${t.state === "running" ? `${elapsed(t.since)} 経過` : ago(t.since)}</span>
    </div>

    ${t.state === "failed" ? `<section class="box danger"><h2><span class="mono">${esc(t.step)}</span> で失敗しました（${t.attempt}回目。onFailure の maxAttempts に達しました）</h2><p>worktree は証拠として残しています。中を確認してから、同じ内容で投入し直すか、worktree を削除してください。</p></section>` : ""}
    ${t.refused ? `<section class="box danger"><h2>worktree の削除を拒否しました</h2><p>完了時に未コミットの変更が残っていました。ワークフローの最終ステップがコミットしていない可能性があります。中を確認してから削除してください。</p><div class="actions"><button class="btn sm danger" data-act="wt-remove" data-path="${esc(t.worktree)}">worktree を削除…</button></div></section>` : ""}
    ${t.degraded ? `<section class="box deg"><h2><span class="mono">${esc(t.degraded)}</span> が、権限で拒否された操作を含んだまま成功扱いで終わりました</h2><p>後続のステップは進んでいますが、エージェントが意図した操作（ここではコミット）はされていません。</p></section>` : ""}
    ${t.state === "queued" ? `<section class="box quiet"><p>実行枠が空くのを待っています（行列の ${queuePos} 番目）。枠が取れた時点で worktree が作られます。</p></section>` : ""}

    <div class="actions">
      ${t.state === "running" ? '<button class="btn" data-act="pause">一時停止</button>' : ""}
      ${t.state === "paused" ? '<button class="btn" data-act="resume">再開</button>' : ""}
      ${!isTerminal(t.state) ? '<button class="btn danger" data-act="cancel">中止</button>' : ""}
      ${retry ? '<button class="btn primary" data-act="retry">同じ内容で投入し直す</button>' : ""}
      ${t.worktree ? `${openButtons(t)}<button class="btn sm" data-act="toast" data-msg="パスをコピーしました">パスをコピー</button>` : ""}
    </div>

    ${t.log ? `<div class="headrow"><b>ログ</b><span class="mono hint">${esc(t.step ?? "")}${t.attempt > 1 ? " #" + t.attempt : ""}</span><span class="spacer"></span><span class="hint">${t.state === "running" ? '<span class="spin" style="display:inline-block;vertical-align:-2px"></span> 追従中' : "末尾 200 行"}</span></div>
    <pre class="block" id="log">${esc(t.log)}</pre>` : ""}

    ${t.step ? `<details class="runs"><summary>実行履歴</summary><div class="runtable"><table>
      <thead><tr><th>ステップ</th><th>種類</th><th>試行</th><th>状態</th></tr></thead>
      <tbody>${steps.slice(0, idx + 1).map((s, i) => `<tr><td class="mono">${esc(s.id)}</td><td class="hint">${s.type}</td><td class="mono">#${i === idx ? t.attempt : 1}</td><td>${i < idx ? '<span class="pill p-ok">成功</span>' : `<span class="pill ${stateTxt[1]}">${stateTxt[0]}</span>`}${t.degraded === s.id ? ' <span class="pill p-deg">degraded</span>' : ""}</td></tr>`).join("")}</tbody>
    </table></div></details>` : ""}
  </div>`;
}

// ================================================================ 中央: worktree と警告
function worktreeView() {
  const rows = worktrees();
  return `<div class="pad">
    <h1>worktree と警告</h1>
    <section class="box quiet"><h2>デーモンからの警告</h2><ul class="warnlist">${WARNINGS.map((w) => `<li>${esc(w.text)} <span class="hint">· ${ago(w.at)}</span></li>`).join("")}</ul></section>
    <div class="headrow"><b>残っている worktree</b><span class="hint">${rows.length} 件 · 終端状態になってから7日を過ぎたものを「古い」とします（孤児はディレクトリの更新日時から）</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>経過</th><th>タスク</th><th>変更</th><th>パス</th><th></th></tr></thead>
      <tbody>${rows.map((w) => {
        const live = w.task && !isTerminal(w.task.state);
        return `<tr class="${(w.ageDays ?? 0) >= 7 ? "stale" : ""}">
          <td class="mono">${w.ageDays == null ? "—" : w.ageDays + "日"}</td>
          <td>${w.task ? `<button class="btn sm" data-act="sel" data-id="${w.task.id}" data-v="tasks">${esc(w.task.title)}</button>` : '<span class="pill p-muted">孤児</span>'}</td>
          <td>${w.dirty ? '<span class="pill p-attn">未コミット</span>' : '<span class="hint">なし</span>'}</td>
          <td class="mono">${esc(w.path)}</td>
          <td>${live ? '<span class="hint">実行中は削除不可</span>' : `<button class="btn sm danger" data-act="wt-remove" data-path="${esc(w.path)}">削除…</button>`}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>`;
}

// ================================================================ モーダル
function modal() {
  if (!S.modal) return "";
  const t = TASKS.find((x) => x.id === S.sel);
  let body = "";
  if (S.modal === "approve-confirm") {
    const un = t.diff.filter((f) => !isViewed(t, f));
    body = `<h2>まだ見ていないファイルが ${un.length} 件あります</h2>
      <ul class="warnlist">${un.map((f) => `<li class="mono">${esc(f.path)}${changedSinceViewed(t, f) ? ' <span class="changed">前回見た後に変更</span>' : ""}</li>`).join("")}</ul>
      <p class="hint">承認は止めません。見落としがないか確かめるための確認です。</p>
      <div class="actions"><button class="btn primary" data-act="approve-do">このまま承認する</button><button class="btn" data-act="modal-close">戻って確認する</button></div>`;
  } else if (S.modal === "reject-preview") {
    const def = stepDef(t);
    body = `<h2>差し戻してエージェントに送る内容</h2>
      <p class="hint">行コメントと全体へのコメントを1つの文字列にまとめて <span class="mono">task.reject(comment)</span> で送ります。<span class="mono">${esc(def.onReject)}</span> ステップに戻ります。</p>
      <pre class="block">${esc(composeRejection(t))}</pre>
      <div class="actions"><button class="btn danger" data-act="reject-do">差し戻す</button><button class="btn" data-act="modal-close">戻る</button></div>`;
  } else if (S.modal === "compose") {
    const c = S.composer;
    body = `<h2>${c.retryOf ? "同じ内容で投入し直す" : "新しいタスク"}</h2>
      ${c.retryOf ? `<p class="hint">元のタスク <span class="mono">${c.retryOf}</span> と worktree はそのまま残ります。</p>` : ""}
      <div class="grid2">
        <div class="field-l"><label for="c-project">プロジェクト</label><select class="field" id="c-project">${PROJECTS.map((p) => `<option value="${p.id}" ${p.id === c.project ? "selected" : ""}>${p.id}</option>`).join("")}</select></div>
        <div class="field-l"><label for="c-wf">ワークフロー</label><select class="field" id="c-wf">${Object.keys(WORKFLOWS).filter((w) => w.startsWith(c.project + "/")).map((w) => { const n = w.split("/")[1]; const dflt = n === proj(c.project).def; return `<option value="${w}" ${w === c.wf ? "selected" : ""}>${n}${dflt ? "（既定）" : ""}</option>`; }).join("")}</select></div>
      </div>
      <p class="hint">手順: ${WORKFLOWS[c.wf].map((s) => `<span class="mono">${esc(s.id)}</span>`).join(" → ")}</p>
      <div class="field-l"><label for="c-title">タイトル</label><input type="text" id="c-title" value="${esc(c.title)}"></div>
      <div class="field-l"><label for="c-prompt">指示</label><textarea id="c-prompt" rows="5">${esc(c.prompt)}</textarea></div>
      <div class="field-l"><label for="c-prio">優先度</label><select class="field" id="c-prio">${[0, 1, 2, 3].map((n) => `<option value="${n}" ${n === c.prio ? "selected" : ""}>P${n}</option>`).join("")}</select></div>
      <div class="actions"><button class="btn primary" data-act="create">投入する</button><button class="btn" data-act="modal-close">やめる</button></div>`;
  } else if (S.modal === "wt-confirm") {
    const w = worktrees().find((r) => r.path === S.confirmWt);
    body = `<h2>worktree を削除しますか？</h2><p class="mono">${esc(w?.path)}</p>
      ${w?.dirty ? "<p><b>未コミットの変更があります。削除すると失われ、戻せません。</b></p>" : ""}
      <div class="actions"><button class="btn danger" data-act="wt-do">削除する</button><button class="btn" data-act="modal-close">やめる</button></div>`;
  }
  return `<div class="scrim" data-act="modal-close"></div><div class="modal" role="dialog">${body}</div>`;
}

// ================================================================ 描画
function render() {
  const t = TASKS.find((x) => x.id === S.sel);
  let main;
  if (S.view === "worktrees") main = worktreeView();
  else if (!t) main = `<div class="pad"><p class="hint">左からタスクを選んでください</p></div>`;
  else if (t.state === "suspended") main = reviewView(t);
  else main = taskView(t);
  const scrollTop = document.querySelector(".main")?.scrollTop ?? 0;
  document.getElementById("root").innerHTML = `<div class="app">${rail()}${sidebar()}<main class="main">${main}</main></div>${modal()}
    <div class="protobar" aria-label="プロトタイプ操作（評価対象外）"><span class="tag">PROTOTYPE</span>
      <span>diff：<button data-act="layout">${S.diffLayout === "stack" ? "全ファイルを連続表示" : "1ファイルずつ表示"}</button></span>
      <span><kbd>j</kbd><kbd>k</kbd> タスク <kbd>n</kbd><kbd>p</kbd> ファイル <kbd>v</kbd> 見た</span></div>
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
  const m = document.querySelector(".main");
  if (m && render.keepScroll) m.scrollTop = scrollTop;
  render.keepScroll = false;
  const lc = document.getElementById("lc-text");
  if (lc && S.editing?.focus) { lc.focus(); S.editing.focus = false; }
}

// ================================================================ 操作（スタブ）
function toast(msg) { S.toast = msg; render.keepScroll = true; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render.keepScroll = true; render(); }, 2200); }
function selectNextReview(except) {
  const next = sidebarOrder().find((x) => groupOf(x) === "review" && x.id !== except);
  if (next) S.sel = next.id;
}
function openComposer(from) {
  const project = from ? from.project : (S.project !== "all" ? S.project : PROJECTS[0].id);
  S.composer = from
    ? { retryOf: from.id, project, wf: from.wf, title: from.title, prompt: from.prompt, prio: from.prio }
    : { project, wf: `${project}/${proj(project).def}`, title: "", prompt: "", prio: 2 };
  S.modal = "compose";
}
function syncComposer() {
  const c = S.composer; if (!c) return;
  c.title = document.getElementById("c-title")?.value ?? c.title;
  c.prompt = document.getElementById("c-prompt")?.value ?? c.prompt;
  c.prio = Number(document.getElementById("c-prio")?.value ?? c.prio);
}

document.addEventListener("change", (e) => {
  if (e.target.id === "proj-filter") { S.project = e.target.value; render(); }
  if (e.target.id === "c-project") { syncComposer(); S.composer.project = e.target.value; S.composer.wf = `${e.target.value}/${proj(e.target.value).def}`; render(); }
  if (e.target.id === "c-wf") { syncComposer(); S.composer.wf = e.target.value; render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "overall") {
    S.overall[S.sel] = e.target.value;
    const t = TASKS.find((x) => x.id === S.sel);
    document.getElementById("reject-btn").disabled = !(commentsOf(t).length || e.target.value.trim());
  }
  if (e.target.id === "lc-text" && S.editing) S.editing.text = e.target.value;
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const t = TASKS.find((x) => x.id === S.sel);
  const act = el.dataset.act;
  switch (act) {
    case "view": S.view = el.dataset.v; if (S.view === "done") { const f = sidebarOrder()[0]; if (f) S.sel = f.id; } else if (S.view === "tasks" && groupOf(t) === "done") { const f = sidebarOrder()[0]; if (f) S.sel = f.id; } break;
    case "sel": S.sel = el.dataset.id; if (el.dataset.v) S.view = el.dataset.v; S.editing = null; break;
    case "toast": return toast(el.dataset.msg);
    case "compose": openComposer(null); break;
    case "retry": openComposer(t); break;
    case "modal-close": syncComposer(); S.modal = null; break;
    case "layout": S.diffLayout = S.diffLayout === "stack" ? "single" : "stack"; break;
    case "scope": S.scope[t.id] = el.dataset.s; S.file[t.id] = undefined; break;
    case "file": {
      S.file[t.id] = el.dataset.path;
      if (S.diffLayout === "stack") { document.getElementById("file-" + el.dataset.path)?.scrollIntoView({ block: "start", behavior: "smooth" }); render.keepScroll = true; }
      break;
    }
    case "viewed": {
      const f = t.diff.find((x) => x.path === el.dataset.path);
      const k = vkey(t, f);
      S.viewed.has(k) ? S.viewed.delete(k) : S.viewed.add(k);
      render.keepScroll = true; break;
    }
    case "lc-new": S.editing = { task: t.id, path: el.dataset.path, line: Number(el.dataset.line), quote: el.dataset.quote, text: "", focus: true }; render.keepScroll = true; break;
    case "lc-cancel": S.editing = null; render.keepScroll = true; break;
    case "lc-save": {
      const ed = S.editing;
      if (ed.text.trim()) commentsOf(t).push({ path: ed.path, line: ed.line, quote: ed.quote, text: ed.text.trim() });
      S.editing = null; render.keepScroll = true; break;
    }
    case "lc-del": commentsOf(t).splice(Number(el.dataset.i), 1); render.keepScroll = true; break;
    case "approve": if (t.diff.some((f) => !isViewed(t, f))) { S.modal = "approve-confirm"; render.keepScroll = true; break; } // fallthrough
    case "approve-do": {
      const steps = WORKFLOWS[t.wf], i = steps.findIndex((x) => x.id === t.step);
      S.modal = null;
      if (i === steps.length - 1) { t.state = "completed"; t.worktree = null; }
      else { t.state = "running"; t.step = steps[i + 1].id; t.attempt = 1; t.log = `$ ${steps[i + 1].id}\n…`; }
      t.since = NOW; selectNextReview(t.id);
      return toast(`承認しました: ${t.title}`);
    }
    case "reject": S.modal = "reject-preview"; render.keepScroll = true; break;
    case "reject-do": {
      const def = stepDef(t);
      t.reviews.push({ at: NOW, text: composeRejection(t) });
      S.comments[t.id] = []; S.overall[t.id] = "";
      t.state = "running"; t.step = def.onReject; t.attempt += 1; t.since = NOW; t.log = "assistant: レビューの指摘を読みます\n…";
      S.modal = null; selectNextReview(t.id);
      return toast(`差し戻しました: ${t.title}`);
    }
    case "pause": t.state = "paused"; t.since = NOW; return toast("一時停止しました");
    case "resume": t.state = "queued"; t.since = NOW; return toast("再開しました。行列の先頭に入ります");
    case "cancel": t.state = "canceled"; t.since = NOW; t.dirty = true; return toast("中止しました。worktree は残します");
    case "create": {
      syncComposer();
      const c = S.composer;
      const id = (c.project[0]) + "-" + Math.random().toString(16).slice(2, 6);
      TASKS.push({ id, wf: c.wf, project: c.project, title: c.title || "無題のタスク", prompt: c.prompt, state: "queued", step: null, attempt: 0, prio: c.prio, since: NOW, worktree: null, branch: `doctrine/${id}` });
      S.modal = null; S.view = "tasks"; S.sel = id;
      return toast("タスクを投入しました");
    }
    case "wt-remove": S.confirmWt = el.dataset.path; S.modal = "wt-confirm"; break;
    case "wt-do": {
      const p = S.confirmWt;
      const oi = ORPHANS.findIndex((o) => o.path === p); if (oi >= 0) ORPHANS.splice(oi, 1);
      TASKS.forEach((x) => { if (x.worktree === p) { x.worktree = null; x.refused = false; x.dirty = false; } });
      const wi = WARNINGS.findIndex((w) => w.text.includes("t-3cd2")); if (wi >= 0 && !TASKS.find((x) => x.id === "t-3cd2").refused) WARNINGS.splice(wi, 1);
      S.modal = null;
      return toast("worktree を削除しました");
    }
  }
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea,select,[contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && S.modal) { S.modal = null; render(); return; }
  const t = TASKS.find((x) => x.id === S.sel);
  if (e.key === "j" || e.key === "k") {
    const order = sidebarOrder(); const i = order.findIndex((x) => x.id === S.sel);
    const n = order[Math.max(0, Math.min(order.length - 1, i + (e.key === "j" ? 1 : -1)))];
    if (n) { S.sel = n.id; S.editing = null; if (S.view === "worktrees") S.view = "tasks"; render(); }
    return;
  }
  if (!t || t.state !== "suspended" || !t.diff.length) return;
  const files = filesFor(t);
  if (e.key === "n" || e.key === "p") {
    const i = Math.max(0, files.findIndex((f) => f.path === (S.file[t.id] ?? files[0].path)));
    const f = files[(i + (e.key === "n" ? 1 : files.length - 1)) % files.length];
    S.file[t.id] = f.path; render.keepScroll = S.diffLayout === "stack"; render();
    if (S.diffLayout === "stack") document.getElementById("file-" + f.path)?.scrollIntoView({ block: "start", behavior: "smooth" });
  }
  if (e.key === "v") {
    const f = t.diff.find((x) => x.path === (S.file[t.id] ?? files[0].path));
    const k = vkey(t, f); S.viewed.has(k) ? S.viewed.delete(k) : S.viewed.add(k);
    render.keepScroll = true; render();
  }
});
setInterval(() => {
  const t = TASKS.find((x) => x.id === S.sel);
  const pre = document.getElementById("log");
  if (!t || t.state !== "running" || !pre || S.view === "worktrees") return;
  t.logIdx = (t.logIdx ?? 0) + 1;
  t.log += "\n" + FOLLOW_POOL[t.logIdx % FOLLOW_POOL.length];
  pre.textContent = t.log;
  pre.scrollTop = pre.scrollHeight;
}, 1800);
render();
</script>
